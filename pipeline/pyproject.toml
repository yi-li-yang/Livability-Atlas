[project]
name = "atlas"
version = "0.0.0"
description = "Livability Atlas data pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
atlas = "atlas.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=3.8",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
spikes = [
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
