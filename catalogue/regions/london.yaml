# A region the app can show. Its fields are defined by the Region model in
# pipeline/src/atlas/catalogue/models.py, and checked by `atlas validate`.
id: london
name: London
country: GB
# Greater London is the ONS's London region. The boundary is fetched, not kept here.
boundary: {dataset: ons-region-boundaries, name: London}
# About 17,000 hex cells of about 0.1 km2 (D04).
grid: {system: h3, resolution: 9}
# Measured indicators are computed 2 km beyond the boundary, so that the edge counts what lies just outside.
buffer_m: 2000
# The default places for travel times (D09): London's main job centres, as points in the middle of
# each, where the Underground station is.
default_places:
  - {name: "The City (Bank)", lat: 51.5133, lng: -0.0886}
  - {name: "The West End (Oxford Circus)", lat: 51.5152, lng: -0.1415}
  - {name: "Canary Wharf", lat: 51.5054, lng: -0.0235}
  - {name: "King's Cross", lat: 51.5308, lng: -0.1238}
