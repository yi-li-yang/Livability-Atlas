          its place.
        datasets: [ofcom-fixed-coverage, ons-output-area-boundaries]
      - id: 5g-coverage
        name: 5G coverage
        description: The share of premises in the borough with a good outdoor 5G signal from all four mobile networks.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: "% of premises"
        preference_type: fixed
        curve: {shape: ramp, t0: 0, t1: 100}
        curve_reason: >-
          The score is the share of premises with a good outdoor 5G signal from
          every network. Nearly every premises in London has 5G from at least
          one network, so coverage from all four is what tells places apart:
          whichever network a user is on, it works.
        evidence_type: estimate
        comparable_across_regions: false
        method: >-
          Ofcom's share of premises with 5G outdoors at high confidence from all
          four mobile networks, for the local authority, so every hex cell in a
          borough shares one value: Ofcom publishes no finer open data. The
          coverage is modelled by the networks, so the evidence type is
          estimate, and Ofcom's signal thresholds are its own, so it does not
          compare across regions.
        datasets: [ofcom-mobile-coverage]
      - {id: broadband-speed, name: "Broadband speed", default_weight: 3, scales: [across-cities]}
      - {id: internet-freedom, name: "Internet freedom", default_weight: 3, scales: [across-cities]}

  - id: urban-form-and-change
    name: Urban form and change
    description: Density, building age, and how the area is changing.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: density
        name: Density
        description: How many people live in the area for each square kilometre.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: residents per km²
        preference_type: user-direction
        curve: {shape: percentile, better: lower}
        curve_reason: >-
          No standard sets the right density, and some users want a busy area
          while others want space and quiet, so a hex cell scores by its rank
          within the region and the user can flip the direction. It starts with
          fewer people as better, because the measures of nightlife and job
          density already reward a busy area.
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The usual residents (Census 2021) in and around the hex cell for each
          square kilometre: the output areas' counts shared between hex cells by
          area, then the mean over the cell and the cells within two steps that
          the region has. It counts residents only, so a business district has a
          low density even when it is crowded by day.
        datasets: [ons-census-2021-residents, ons-output-area-boundaries]
      - id: building-age
        name: Building age
        description: The year in which the homes nearby were built, in the middle.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: year built
        preference_type: user-range
        curve: {shape: ideal-range, l0: 1800, l1: 1850, u1: 2020, u0: 2030}
        curve_reason: >-
          No age of building is better for everyone: some users want Victorian
          terraces and others a new block. The band that the user drags sets
          the ages that score in full, and until the user drags it, it covers
          every age that London's homes have, so that every cell scores the same.
        evidence_type: estimate
        comparable_across_regions: false
        method: >-
          The median year in which the homes with an energy certificate in and
          around the hex cell were built, within one step, with at least 30
          dated homes. A certificate gives the age as a band of years, such as
          1930 to 1949, and the year is the middle of its band (1880 for homes
          built before 1900, 2010 for 2007 onwards). A home counts once, by its
          latest certificate, and the register holds only homes that were sold,
          let or improved since 2008, so it leans towards homes that changed
          hands. No address is kept.
        datasets: [epc-domestic, os-code-point-open]
      - {id: regeneration, name: "Regeneration and planning", default_weight: 3, scales: [within-city]}
      - {id: urban-growth, name: "Urban growth", default_weight: 3, scales: [across-cities]}

  - id: governance-and-rights
    name: Governance and rights
    description: How a country is governed, and the rights people have there.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [across-cities]
    children:
      - {id: rule-of-law, name: "Rule of law", default_weight: 3}
      - {id: democracy, name: "Democracy", default_weight: 3}
      - {id: press-freedom, name: "Press freedom", default_weight: 3}
      - {id: corruption, name: "Corruption", default_weight: 3}
      - {id: lgbtq-friendliness, name: "LGBTQ+ friendliness", default_weight: 3, description: "Legal rights and public acceptance."}

  - id: published-rankings
    name: Published rankings
    description: Outside lists and indices of places, kept as a supporting factor.
    default_weight: 1
    weight_reason: Supporting factor. It partly repeats the other factors, so it starts low (D14).
    scales: [within-city, across-cities]
    children:
      - id: sunday-times-best-places
        name: Sunday Times Best Places to Live
        description: Whether the latest Sunday Times guide names the area.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: listing
        preference_type: fixed
        curve: {shape: lookup, scores: {listed: 1, not listed: 0}}
        curve_reason: &listing-reason >-
          A ranking names a few places and says nothing about the rest, so a
          hex cell in a named place scores 1 and any other 0. Published
          rankings start at a low default weight, so a listing cannot outweigh
          the measured factors (D14).
        evidence_type: ranking
        comparable_across_regions: false
        method: &listing-method >-
          The hex cells inside the neighbourhoods that the latest edition names,
          matched to the neighbourhoods' boundaries by name. Only the list of
          names and a citation are stored. The assessment of the ranking is in
          docs/factors/rankings.md.
        datasets: [sunday-times-best-places-to-live]
      - id: time-out-neighbourhoods
        name: Time Out neighbourhood lists
        description: Whether Time Out's latest list of the world's coolest neighbourhoods names the area.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: listing
        preference_type: fixed
        curve: {shape: lookup, scores: {listed: 1, not listed: 0}}
        curve_reason: *listing-reason
        evidence_type: ranking
        comparable_across_regions: false
        method: *listing-method
        datasets: [time-out-coolest-neighbourhoods]
      - {id: eiu-liveability, name: "EIU Global Liveability Index", default_weight: 3, scales: [across-cities]}
      - {id: mercer-quality-of-living, name: "Mercer Quality of Living", default_weight: 3, scales: [across-cities]}
      - {id: monocle-quality-of-life, name: "Monocle Quality of Life", default_weight: 3, scales: [across-cities]}
      - {id: oecd-better-life, name: "OECD Better Life Index", default_weight: 3, scales: [across-cities]}

  - id: resident-wellbeing
    name: Resident wellbeing
    description: How residents rate their lives, and how long they live.
    default_weight: 1
    weight_reason: Supporting factor. It partly repeats the other factors, so it starts low (D14).
    scales: [within-city, across-cities]
    children:
      - {id: life-satisfaction, name: "Life satisfaction", default_weight: 3, scales: [within-city]}
      - {id: happiness, name: "Happiness", default_weight: 3, scales: [across-cities]}
      - {id: life-expectancy, name: "Life expectancy", default_weight: 3}
