  - id: digital-connectivity
    name: Digital connectivity
    description: Broadband and mobile coverage.
    default_weight: 1
    weight_reason: "Only the AARP framework names it, under internet access, so it takes the floor of 1."
    scales: [within-city, across-cities]
    children:
      - id: gigabit-broadband
        name: Gigabit broadband
        description: The share of homes that can get gigabit-capable broadband, over full fibre or cable.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: "% of homes"
        preference_type: fixed
        curve: {shape: ramp, t0: 0, t1: 100}
        curve_reason: >-
          The score is the share of homes that can order a gigabit-capable
          connection, the fastest band Ofcom reports for small areas.
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          Ofcom's share of homes with gigabit-capable coverage in each census
          output area, combined over the output areas that overlap the hex
          cell, weighted by their homes. Ofcom does not publish full-fibre
          coverage for small areas, because providers keep it confidential, so
          gigabit-capable coverage, which includes full fibre and cable, takes
          its place.
        datasets: [ofcom-fixed-coverage, ons-output-area-boundaries]
      - id: 5g-coverage
        name: 5G coverage
        description: The share of premises in the borough with a good outdoor 5G signal from all four mobile networks.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: "% of premises"
        preference_type: fixed
        curve: {shape: ramp, t0: 0, t1: 100}
        curve_reason: >-
          The score is the share of premises with a good outdoor 5G signal from
          every network. Nearly every premises in London has 5G from at least
          one network, so coverage from all four is what tells places apart:
          whichever network a user is on, it works.
        evidence_type: estimate
        comparable_across_regions: false
        method: >-
          Ofcom's share of premises with 5G outdoors at high confidence from all
          four mobile networks, for the local authority, so every hex cell in a
          borough shares one value: Ofcom publishes no finer open data. The
          coverage is modelled by the networks, so the evidence type is
          estimate, and Ofcom's signal thresholds are its own, so it does not
          compare across regions.
        datasets: [ofcom-mobile-coverage]
      - {id: broadband-speed, name: "Broadband speed", default_weight: 3, scales: [across-cities]}
      - {id: internet-freedom, name: "Internet freedom", default_weight: 3, scales: [across-cities]}

  - id: urban-form-and-change
    name: Urban form and change
    description: Density, building age, and how the area is changing.
    default_weight: 1
    weight_reason: >-
      None of D14's five sources mentions density, building age or
      regeneration, so it takes the floor of 1.
    scales: [within-city, across-cities]
    children:
      - {id: density, name: "Density", default_weight: 3, scales: [within-city], description: "Some users want a busy area and others a quiet one, so the user sets the direction."}
      - {id: building-age, name: "Building age", default_weight: 3, scales: [within-city], description: "The user sets an ideal range."}
      - {id: regeneration, name: "Regeneration and planning", default_weight: 3, scales: [within-city]}
      - {id: urban-growth, name: "Urban growth", default_weight: 3, scales: [across-cities]}

