# The factor tree: every factor a user can weight, from broad to specific.
# Terms are defined in docs/glossary.md.
#
# It started as the seed tree from the approved Phase 0 plan. A factor without
# sub-factors is a measured indicator, and research fills in its unit, scoring
# curve, evidence type and datasets. The field reference, and the rules the
# checks enforce, are in catalogue/README.md.
#
# Weight rules:
# - A top-level factor's default_weight comes from evidence of what people
#   value (D14): how many of five sources weigh it. See
#   docs/specs/2026-10-28-default-weights.md for the five sources, the
#   mapping and the judgement calls it took.
# - A sub-factor keeps the engineering default of 3 until its own evidence
#   separates it, 1 for the two supporting factors, and 0 for choice
#   factors and community composition.
#   A default_weight other than 3 needs a weight_reason.
# - A sub-factor inherits its parent's scales, or lists a subset of them.
# - A measured indicator's status is idea unless stated, and its status
#   decides which fields it needs. A factor with sub-factors has no status of
#   its own.
#
# After editing, refresh the factor explorer and run its tests:
#   node docs/factors/embed-catalogue.mjs
#   node --test "docs/factors/*.test.mjs"

factors:
  - id: housing-and-cost
    name: Housing and cost
    description: What it costs to buy or rent a home, and to live in the area.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: buying-cost
        name: Buying cost
        description: The price per square metre of the homes sold nearby.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: £ per m²
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: &cost-curve-reason >-
          No standard sets a fair price, and prices differ between regions and
          currencies, so a hex cell scores by its rank within the region. A
          user's budget belongs in a hard limit, not in the curve.
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The median price per square metre of the homes sold in and around the
          hex cell over the last 24 months of HM Land Registry's Price Paid
          Data (standard sales of houses and flats): each sale's price divided
          by the floor area on the energy certificate of the same home. A sale
          is matched to its certificate by its postcode and the words of its
          address, whatever their order or abbreviation, using every
          certificate since 2008 (a home with several has the median of their
          areas). In London 84% of sales find a certificate (73% of detached
          homes, 83% of flats, 85% of semi-detached and 90% of terraced). The
          others, and floor areas under 10 or over 500 m², are left out. A sale
          sits in the cell of its postcode's centre (Code-Point Open). Spike S3
          found that pooling the sales of a cell and its neighbours within two
          steps gives 20 or more sales in 99% of London's homes cells, against
          the 37 that a median within 15% needs for a price, and fewer for a
          price per square metre, which separates flats from houses. A cell
          with fewer than 20 sales around it has no value (16% of London's:
          parks, and the edge). The addresses serve only for the match, and
          the build keeps a hash of each, not the address.
        datasets: [hm-land-registry-price-paid, epc-domestic, os-code-point-open]
      - id: renting-cost
        name: Renting cost
        description: The average monthly private rent in the borough.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: £ a month
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: *cost-curve-reason
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The ONS's average monthly private rent for the local authority, for all
          homes, so every hex cell in a borough shares one value. The ONS also
          breaks rents down by number of bedrooms, which can follow the user's
          home size later. It publishes London rents by postcode district too,
          but warns that its sample is purposive and should not be compared
          between areas, so they stay out of the score. Spike S3 found that a
          model of rent from sale prices predicts a district's rent to within
          7% of the ONS's figure, against 8% for its borough's average, so
          it adds too little to be worth a per-cell value.
        datasets: [ons-private-rents, ons-london-rents-by-district]
      - id: council-tax
        name: Council tax
        description: The Band D council tax of the borough.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: £ a year (Band D)
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: *cost-curve-reason
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The billing authority's average Band D council tax for the current
          year, including precepts such as the Mayor of London's, so every hex
          cell in a borough shares one value. A home's own band sets its real
          bill, so Band D serves only to compare places.
        datasets: [mhclg-council-tax]
      - id: energy-efficiency
        name: Home energy efficiency
        description: How well the homes nearby keep heat in, on the energy certificate's scale.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: SAP points
        preference_type: fixed
        curve: {shape: ramp, t0: 38, t1: 81}
        curve_reason: >-
          The energy certificate's bands run from G to A on a scale of 1 to 100
          points: band B starts at 81 and band F ends at 38. A cell scores 0 at
          38 points (the top of band F, a home that loses heat and costs the
          most to warm) and 1 at 81 (the start of band B), so that a cell whose
          typical home is in band C (69 to 80) scores about three quarters. The
          government's aim is band C for as many homes as possible, which this
          curve scores well and does not treat as the end.
        evidence_type: estimate
        comparable_across_regions: false
        method: >-
          The median energy efficiency, in the certificate's SAP points, of the
          homes with an energy certificate in and around the hex cell: each
          home counts once, by its latest certificate (a home is told apart by
          its UPRN, or by its address where the certificate has none), and a
          certificate sits at the centre of its postcode (Code-Point Open). The
          cells within one step are pooled, and a cell with fewer than 30 homes
          around it has no value. The score is a model of the home's fabric and
          heating, from an assessor's survey (RdSAP), not a meter reading, and
          the register holds only homes that were sold, let or improved since
          2008, so it leans towards homes that changed hands. No address is
          kept: the build holds a postcode and the points of each home.
        datasets: [epc-domestic, os-code-point-open]
      - id: price-trend
        name: Price trend
        description: How much the price of a home nearby has risen over the last five years.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: "% change over five years"
        preference_type: user-direction
        curve: {shape: percentile, better: lower}
        curve_reason: >-
          No standard sets a fair rise in prices, and the same rise is good news
          for an owner and bad news for a buyer, so a hex cell scores by its
          rank within the region and the user can flip the direction. It starts
          with the buyer's and the renter's view, that a place whose prices rose
          less is still within reach.
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The change in the median price per square metre of the homes sold in
          and around the hex cell, from the 24 months that ended five years
          before the latest sale in HM Land Registry's Price Paid Data to the
          latest 24 months. Both are found as the buying cost is (the same
          floor areas, the same pooling over the cells within two steps, 20 or
          more sales), so a mix of larger homes in one window does not move
          the trend much. A cell with fewer than 20 sales around it in either
          window has no value. It is a rise in the price of what sold, not
          of a fixed set of homes, and the two windows include the period when
          stamp duty was cut (2020 to 2021).
        datasets: [hm-land-registry-price-paid, epc-domestic, os-code-point-open]
      - id: sales-volume
        name: Sales volume
        description: How many homes change hands nearby each year, against the number of residents.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: sales a year per 1,000 residents
        preference_type: user-direction
        curve: {shape: percentile, better: higher}
        curve_reason: >-
          No standard sets how many homes should sell, so a hex cell scores by
          its rank within the region. It starts with a busy market scoring
          higher, because a home there is easier to buy and to sell, and the
          user can flip the direction to prefer places where people stay.
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The standard sales of homes in HM Land Registry's Price Paid Data over
          the latest 24 months, as a number a year, in and around the hex cell
          (the cells within two steps) against the usual residents of the same
          cells (Census 2021, shared from the output areas by area). Like the
          crime rates, the figure adds a floor of 3,000 residents at the
          region's overall rate, so that a cell with few residents has no wild
          value. A sale sits in the cell of its postcode's centre
          (Code-Point Open). A block of new flats that sells all at once in one
          year raises its cell, and a home that sells twice counts twice.
        datasets: [hm-land-registry-price-paid, os-code-point-open, ons-census-2021-residents]
      - {id: rent-and-price-levels, name: "Rent and price levels", default_weight: 3, scales: [across-cities]}
      - {id: purchasing-power, name: "Purchasing power", default_weight: 3, scales: [across-cities]}
      - {id: tax-burden, name: "Tax burden", default_weight: 3, scales: [across-cities]}

  - id: transport
    name: Transport
    description: How easily you get around, and how long it takes to reach the places you go.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: getting-around
        name: Getting around in general
        description: The same for every user. Stations, lines and services near each hex cell.
        default_weight: 3
        scales: [within-city]
        children:
          - id: station-proximity
            name: Walk to the nearest station
            description: Walking minutes to the nearest Tube, rail, DLR, Overground, Elizabeth line or tram station.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 6}
            curve_reason: >-
              1 within 6 minutes and 0 at 25 minutes: about 500 m and 2,000 m
              at 4.8 km/h, the desirable and the preferred maximum walking
              distances for commuting in Table 3.2 of the CIHT's Guidelines for
              Providing for Journeys on Foot (2000). 4.8 km/h is the walking
              speed TfL uses for PTAL.
            evidence_type: direct
            comparable_across_regions: true
            method: >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest station entrance, at 4.8 km/h. Spike S6
              measures how far walking routes differ from straight lines.
              The build reads OpenStreetMap's streets and paths that people may walk, joins them into a network, and measures from each cell's centre to the nearest active rail or metro entrance in NaPTAN. A point first walks in a straight line to the nearest street of the main network, which leaves out cut-off fragments such as private estates. On London the walks run a median 1.36 times their straight line, against 1.33 in spike S6, and none is shorter. Cells near the edge of Greater London may overstate the walk, because the streets beyond it are not in the network.
            datasets: [tfl-unified-api, naptan, openstreetmap]
          - id: line-choice
            name: Line choice
            description: How many rail and Tube lines and bus routes run within a short walk.
            default_weight: 3
            children:
              - id: rail-lines-nearby
                name: Rail and Tube lines nearby
                description: Tube, rail, DLR, Overground, Elizabeth line and tram lines at stations within a 12-minute walk.
                default_weight: 3
                status: built
                unit: lines
                preference_type: fixed
                curve: {shape: percentile, better: higher}
                curve_reason: >-
                  No standard says how many lines are enough, so a hex cell scores
                  by its rank within the region: the share of hex cells with fewer.
                  The counts are too skewed for a ramp: in London's built data the
                  median cell has no line within the walk, the 95th percentile has
                  3 and Bank has 17.
                evidence_type: direct
                comparable_across_regions: false
                method: >-
                  The number of distinct lines serving stations within a
                  12-minute walk (960 m at 4.8 km/h) along streets and paths,
                  the walk TfL's PTAL allows to a rail or Tube station. National
                  Rail services count as TfL's data lists them: by operator, not
                  by route, so a station served by one operator counts once. Cities divide
                  their networks into lines differently, so the count does not
                  compare across regions.
                datasets: [tfl-unified-api, openstreetmap]
              - id: bus-routes-nearby
                name: Bus routes nearby
                description: Day bus routes at stops within an 8-minute walk.
                default_weight: 3
                status: built
                unit: routes
                preference_type: fixed
                curve: {shape: percentile, better: higher}
                curve_reason: >-
                  No standard says how many routes are enough, so a hex cell scores
                  by its rank within the region: the share of hex cells with fewer.
                  In London's built data the median cell has 3 routes within the
                  walk, the 95th percentile 14 and Soho 47.
                evidence_type: direct
                comparable_across_regions: false
                method: >-
                  The number of distinct day bus routes stopping within an
                  8-minute walk (640 m at 4.8 km/h) along streets and paths, the
                  walk TfL's PTAL allows to a bus stop. Night routes belong to
                  Night and step-free travel.
                datasets: [tfl-unified-api, openstreetmap]
          - id: service-level
            name: Service level
            description: TfL's PTAL index, which combines walking time and service frequency.
            default_weight: 3
            status: built
            unit: PTAL band
            preference_type: fixed
            curve: {shape: lookup, scores: {0: 0, 1a: 0.125, 1b: 0.25, 2: 0.375, 3: 0.5, 4: 0.625, 5: 0.75, 6a: 0.875, 6b: 1}}
            curve_reason: >-
              TfL grades PTAL in nine bands, from 0 (worst) to 6b (best). The
              scores rise in equal steps of 1/8, because TfL gives the bands no
              other weighting.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The PTAL band that covers most of the hex cell, from TfL's 100 m
              grid, with a tie going to the lower band. Spike S1 found that it
              matches the band at the cell's centre in 82% of cells, against
              69% for the band of the cell's mean index. The grid stops at
              Greater London's boundary, so cells beyond it have no value. The
              London Datastore's release is from 2015, before the Elizabeth
              line opened, and TfL's WebCAT team supplies its latest data on
              request.
            datasets: [tfl-ptal]
          - id: travel-cost
            name: Travel cost
            description: The fare zone of the nearest station, which sets the cost of travel to central London.
            default_weight: 3
            status: built
            unit: fare zone
            preference_type: fixed
            curve: {shape: lookup, scores: {1: 1, 2: 1, 3: 0.89, 4: 0.73, 5: 0.56, 6: 0.49, 7: 0.38, 8: 0.16, 9: 0}}
            curve_reason: >-
              The scores follow TfL's 2026 weekly caps for pay-as-you-go travel
              from zone 1. Zones 1 and 2 score 1, because £44.70 for zones 1–2
              is the lowest cap that includes zone 1, and zone 9 scores 0, at
              £116.40 for zones 1–9, the highest. Between them, a zone's score
              falls in proportion to its cap: zone 4's £64.20 scores 0.73.
              Source: TfL, Adult rate prices 2026. Update the scores when fares
              change.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The fare zone of the nearest Tube, rail, DLR, Overground, tram or
              Elizabeth line station inside TfL's fare zones, in a straight line
              from the hex cell's centre. TfL gives each station its zone in its
              data for the station's lines. A station in two zones counts as the
              lower one, and a station outside the zones is not a choice.
            datasets: [tfl-unified-api]
          - {id: night-and-step-free, name: "Night and step-free travel", default_weight: 3}
          - {id: cycling, name: "Cycling", default_weight: 3, description: "Protected lanes, cycle-hire docks and slope."}
      - id: travel-time-to-places
        name: Travel time to places
        description: Door-to-door public-transport time to the default places, or to the user's own places.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: minutes
        preference_type: fixed
        curve: {shape: ramp, t0: 90, t1: 15}
        curve_reason: >-
          1 at 15 minutes or less, falling to 0 at 90 minutes or more: the ONS
          reported in 2014 that personal well-being was lowest for commutes of
          61 to 90 minutes, against those of 15 minutes or less. The GLA found
          the effect of commute length small in London (Commuting and individual
          well-being in London, 2015), so the ramp is wide and gentle. London's
          cells spread across it: the middle half run from 53 to 74 minutes,
          the 5th to 95th percentile from 37 to 89, and the City and the West
          End are 21 to 25.
        evidence_type: estimate
        comparable_across_regions: true
        method: >-
          The mean over the default places (D09: the City at Bank, the West End
          at Oxford Circus, Canary Wharf and King's Cross) of the quickest
          door-to-door time by public transport, leaving at 08:30 on a weekday
          (Wednesday 4 November 2026). It is an estimate, because a hex cell's
          own journey cannot be asked of TfL's Journey Planner for each of
          17,000 cells: the Journey Planner gives the quickest journey, by all
          modes with buses, from each of the region's stations to each place,
          and a cell takes the walk along streets to a station within 40
          minutes plus that station's journey, whichever station gives the
          shortest total for the place. A walk to a station that long is an
          upper bound on what the journey takes, as a bus would be quicker, so
          the time is too long for the cells far from a station. A cell with no
          station within 40 minutes' walk (8% of London's: parks and the edge)
          has no value. Spike S4 found such an estimate within 20% of the
          Journey Planner's door-to-door time in 81% of journeys, and too long
          in 19%, because buses are not in the station times. A
          user's own places get an estimate in the browser instead, from the
          same station times (D10). The weekday-morning timetable is
          one departure, not a range of them.
        datasets: [tfl-unified-api, openstreetmap]
      - {id: airport-connectivity, name: "Airport connectivity", default_weight: 3, scales: [across-cities]}
      - {id: intercity-rail, name: "Intercity rail", default_weight: 3, scales: [across-cities]}

  - id: daily-amenities
    name: Daily amenities
    description: Shops, food and services within an easy walk.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: everyday-amenities
        name: Everyday amenities
        description: Everyday shops and services within a 10-minute walk.
        default_weight: 3
        scales: [within-city]
        children:
          - id: groceries
            name: Groceries
            description: Walking minutes to the nearest supermarket, convenience shop or greengrocer.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: &walk-to-amenity-reason >-
              1 within 5 minutes and 0 at 15 minutes: about 400 m and 1,200 m
              at 4.8 km/h, the desirable and the preferred maximum walking
              distances for trips other than commuting in Table 3.2 of the
              CIHT's Guidelines for Providing for Journeys on Foot (2000).
            evidence_type: direct
            comparable_across_regions: true
            method: &walk-to-amenity-method >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest place of this kind, at 4.8 km/h, from the
              place data's categories, from Overture (leaving out those it
              marks permanently closed) and OpenStreetMap together. Spike S6
              found that a straight line understates a walk: along streets it is
              a median 1.33 times longer, from 1.13 to 1.88 times for 90% of
              routes, and over 1.5 times for 23%, so the walk is measured along
              streets. It also found that the two sources together match 76% of
              the Food Standards Agency's supermarkets and convenience shops by
              name within 100 m (Overture 67%, OpenStreetMap 61%), a lower
              bound, since the register holds legal names.
            datasets: &place-datasets [overture-places, openstreetmap]
          - id: pharmacies
            name: Pharmacies
            description: Walking minutes to the nearest pharmacy.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *walk-to-amenity-method
            datasets: *place-datasets
          - id: cafes
            name: Cafés
            description: The number of cafés within a 10-minute walk.
            default_weight: 3
            status: built
            unit: cafés
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: &count-reason >-
              No standard says how many are enough, so a hex cell scores by its
              rank within the region: the share of hex cells with fewer. Spike
              S6 counted cafés and restaurants within 800 m of London's homes.
              The counts are too skewed for a ramp: the median home has 11
              cafés and 35 restaurants, and the 95th percentile has 76 and 194.
            evidence_type: direct
            comparable_across_regions: true
            method: &count-method >-
              The number of places of this kind within a 10-minute walk along
              streets and paths: 800 m at 4.8 km/h, the walking distance CIHT
              calls acceptable for trips other than commuting. Places come from
              Overture (leaving out those it marks permanently closed) and
              OpenStreetMap together, counting a place once when both list it.
              Spike S6 found that the two together match 66% of the Food
              Standards Agency's cafés, restaurants and takeaways by name
              within 100 m (Overture 60%, OpenStreetMap 43%). That is a lower
              bound, since the register holds legal names, so the counts
              understate.
            datasets: *place-datasets
          - id: gyms
            name: Gyms
            description: Walking minutes to the nearest gym or fitness centre.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *walk-to-amenity-method
            datasets: *place-datasets
          - id: libraries
            name: Libraries
            description: Walking minutes to the nearest public library.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *walk-to-amenity-method
            datasets: *place-datasets
      - id: food-and-drink
        name: Food and drink
        description: The choice, variety and quality of places to eat.
        default_weight: 3
        children:
          - id: restaurant-choice
            name: Restaurant choice
            description: The number of restaurants within a 10-minute walk.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: restaurants
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: *count-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *count-method
            datasets: *place-datasets
          - id: cuisine-variety
            name: Cuisine variety
            description: The number of different cuisines served by restaurants within a 10-minute walk.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: cuisines
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard says how many cuisines are enough, so a hex cell
              scores by its rank within the region: the share of hex cells with
              fewer. Spike S8 counted them within 800 m of London's homes: from
              Overture's categories the median is 12, and the 5th to 95th
              percentile runs from 2 to 41.
            evidence_type: indirect
            comparable_across_regions: true
            method: >-
              The number of distinct cuisines among the restaurants within a
              10-minute walk along streets and paths (800 m at 4.8 km/h), from
              Overture's categories, with OpenStreetMap's cuisine tags to fill
              gaps. Variety is a sign of a lively food scene rather than a
              measure of it, so the evidence type is indirect. Spike S8 found
              that 77% of Overture's restaurants carry a specific cuisine
              category (148 kinds) and 73% of OpenStreetMap's a cuisine tag (264
              values, which need tidying), so Overture leads. No cuisine is
              found near 1% of homes by Overture's categories, and near 18% by
              OpenStreetMap's tags.
            datasets: [overture-places, openstreetmap]
          - {id: your-cuisines, name: "Your cuisines", default_weight: 0, weight_reason: "Choice factor: weight 0 until the user picks cuisines (D18)."}
          - id: food-hygiene
            name: Food hygiene
            description: The share of the food businesses within a 10-minute walk rated good or very good for hygiene.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: "% of food businesses"
            preference_type: fixed
            curve: {shape: ramp, t0: 0, t1: 100}
            curve_reason: >-
              The score is the share of nearby food businesses rated 4 (good)
              or 5 (very good) under the Food Hygiene Rating Scheme, whose
              ratings run from 0 to 5.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The share of the food businesses with a rating within a 10-minute
              walk along streets and paths (800 m at 4.8 km/h) that are rated 4
              or 5. Businesses awaiting inspection are left out, and so is a cell with fewer than 5 rated businesses in reach, whose share would say little. Scotland rates
              food hygiene under a different scheme, so the share does not
              compare across regions. Spike S8 found that 98% of London's homes
              cells have 10 or more rated businesses within 800 m, and that the
              share spreads from 69% to 97% across the 5th to 95th percentile
              (median 87%), against 85% good or very good overall.
            datasets: [fsa-food-hygiene-ratings]
          - {id: guide-recognition, name: "Guide recognition", default_weight: 3, description: "Michelin and other guides, through Wikidata."}
          - {id: independents, name: "Independent restaurants", default_weight: 3, scales: [within-city], description: "The share of restaurants that are not chains."}
      - id: brand-presence
        name: Brand presence
        description: Chain brands and shopping centres nearby, as a sign of how large companies rate the area.
        default_weight: 3
        scales: [within-city]
        children:
          - {id: shopping-centres, name: "Shopping centres", default_weight: 3}
          - {id: brand-variety, name: "Brand variety", default_weight: 3}
          - {id: brand-groups, name: "Brand groups", default_weight: 3, description: "Premium, high-footfall, large-catchment and value brands."}
      - {id: shopping, name: "Shopping", default_weight: 3, scales: [across-cities], description: "Shopping centres, and flagship and big-box stores."}
      - {id: destinations, name: "Destinations", default_weight: 0, scales: [within-city], weight_reason: "Choice factor: weight 0 until the user picks destinations (D18). Planned for Phase 2.", description: "Distance to public places or chains the user picks, such as IKEA or the nearest airport."}

  - id: environment
    name: Environment
    description: Air, noise, green space, water and heat where you live.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: air-quality
        name: Air quality
        default_weight: 3
        children:
          - id: no2
            name: NO₂, annual mean
            description: Nitrogen dioxide in the air, as a yearly average.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: µg/m³
            preference_type: fixed
            curve: {shape: ramp, t0: 40, t1: 10}
            curve_reason: >-
              1 at 10 µg/m³, the WHO's 2021 air quality guideline for the
              annual mean, and 0 at 40 µg/m³, the UK's legal limit for the
              annual mean, which is also the WHO's first interim target.
              Sources: WHO global air quality guidelines (2021); the Air
              Quality Standards Regulations 2010.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The mean, over the hex cell, of the modelled annual mean
              concentration in 2022 from the LAEI, read at 49 points spread
              evenly over the cell, each taking the value of the nearest point
              of the 20 m grid. Spike S5 found for noise that the mean at a
              cell's addresses beats the mean over its area, but could not test
              it on air quality, so the area mean stays until it can. The data
              are modelled from emissions and monitoring, so the evidence type
              is estimate. The LAEI has no stated licence, so commercial builds
              leave this out. The LAEI's 20 m
              grid resolves the higher concentrations beside roads. Defra's
              background maps leave out local sources such as roads, so they
              stand in only where no city dataset exists.
            datasets: [laei, defra-background-maps]
          - id: pm25
            name: PM2.5, annual mean
            description: Fine particles in the air, 2.5 micrometres across or smaller, as a yearly average.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: µg/m³
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 5}
            curve_reason: >-
              1 at 5 µg/m³, the WHO's 2021 air quality guideline for the annual
              mean, and 0 at 25 µg/m³, its second interim target. The first
              interim target, 35 µg/m³, would leave most of the curve unused in
              the UK, where every compliance zone met the legal limit of
              20 µg/m³ in 2023 and 2024. Sources: WHO global air quality
              guidelines (2021); Defra's Air Pollution in the UK reports for
              2023 and 2024.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The mean, over the hex cell, of the modelled annual mean
              concentration in 2022 from the LAEI, read at 49 points spread
              evenly over the cell, each taking the value of the nearest point
              of the 20 m grid. Spike S5 found for noise that the mean at a
              cell's addresses beats the mean over its area, but could not test
              it on air quality, so the area mean stays until it can. The data
              are modelled from emissions and monitoring, so the evidence type
              is estimate. The LAEI has no stated licence, so commercial builds
              leave this out.
            datasets: [laei, defra-background-maps]
      - id: noise
        name: Noise
        description: Daytime noise from roads, railways and aircraft.
        default_weight: 3
        scales: [within-city]
        children:
          - id: road-noise
            name: Road traffic noise
            description: The average noise level from road traffic, from 7 am to 11 pm.
            default_weight: 3
            status: built
            unit: dB (daytime)
            preference_type: fixed
            curve: {shape: ramp, t0: 70, t1: 50}
            curve_reason: >-
              1 at 50 dB and 0 at 70 dB: the daytime levels at which ProPG, the
              professional guidance on noise for new homes in England (ANC, IOA
              and CIEH, 2017), places a site at negligible and at high risk.
              ProPG applies its scale to all transport noise together, and here
              it scores each source alone.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The modelled daytime level, LAeq,16h from 07:00 to 23:00, from
              Defra's strategic noise maps, at the cell's address points: the
              arithmetic mean, in dB, of the level at each address, with levels
              below the maps' 40 dB cut-off counted as 40 dB. A cell with no
              address, such as a park, takes the arithmetic mean over its
              area. Spike S5 found that this matches the average of the
              addresses' own scores almost exactly (rank correlation 0.97),
              and that averaging over the cell's area does not (0.76 for the
              arithmetic mean, 0.82 for the sound energy mean, 0.75 for the
              highest pixel). The noise is modelled, so the evidence type is
              estimate.
            datasets: [defra-road-noise]
          - id: rail-noise
            name: Rail noise
            description: The average noise level from railways, from 7 am to 11 pm.
            default_weight: 3
            status: built
            unit: dB (daytime)
            preference_type: fixed
            curve: {shape: ramp, t0: 70, t1: 50}
            curve_reason: >-
              1 at 50 dB and 0 at 70 dB: the daytime levels at which ProPG, the
              professional guidance on noise for new homes in England (ANC, IOA
              and CIEH, 2017), places a site at negligible and at high risk.
              ProPG applies its scale to all transport noise together, and here
              it scores each source alone.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The modelled daytime level, LAeq,16h from 07:00 to 23:00, from
              Defra's strategic noise maps, at the cell's address points: the
              arithmetic mean, in dB, of the level at each address, with levels
              below the maps' 40 dB cut-off counted as 40 dB. A cell with no
              address, such as a park, takes the arithmetic mean over its
              area. Spike S5 found, for road noise, that this matches the average of the
              addresses' own scores almost exactly (rank correlation 0.97),
              and that averaging over the cell's area does not (0.76 for the
              arithmetic mean, 0.82 for the sound energy mean, 0.75 for the
              highest pixel). The noise is modelled, so the evidence type is
              estimate.
            datasets: [defra-rail-noise]
          - id: aircraft-noise
            name: Aircraft noise
            description: The average noise level from aircraft, from 7 am to 11 pm.
            default_weight: 3
            status: built
            unit: dB (daytime)
            preference_type: fixed
            curve: {shape: ramp, t0: 63, t1: 51}
            curve_reason: >-
              1 at 51 dB, the lowest level at which the government finds
              adverse effects from aircraft noise (Air Navigation Guidance,
              2017), and 0 at 63 dB, the level at which it expects airports to
              help insulate homes (Aviation Policy Framework, 2013, paragraph
              3.39). Aircraft noise has its own thresholds: the WHO's 2018
              guidelines also set a lower level for it than for road or rail
              noise.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The modelled daytime level, LAeq,16h from 07:00 to 23:00, from
              Defra's strategic noise maps of airports, at the cell's address
              points, averaged as road noise is. Each airport's operator
              modelled its own map, so the lowest level mapped varies by
              airport, and away from the airports the maps cover, aircraft
              noise counts as their 40 dB cut-off. Spike S5 tested the
              averaging on road noise only.
            datasets: [defra-airport-noise]
      - id: green-space
        name: Green space
        default_weight: 3
        children:
          - id: walk-to-green-space
            name: Walk to a green space
            description: Walking minutes to the nearest public park or other green space of at least 2 hectares.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 4}
            curve_reason: >-
              1 within 4 minutes and 0 at 15 minutes: about 300 m and 1,200 m at
              4.8 km/h. Natural England's Accessible Greenspace Standard (2024)
              asks for a natural green space of at least 2 ha within 300 m of
              home, and 1,200 m is the preferred maximum walking distance for
              trips other than commuting in Table 3.2 of the CIHT's Guidelines
              for Providing for Journeys on Foot (2000).
            evidence_type: direct
            comparable_across_regions: true
            method: >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest way in on foot to a public park or playing
              field of at least 2 ha, natural or not, at 4.8 km/h, from OS Open
              Greenspace. Play spaces, sports facilities, allotments and
              cemeteries are left out, as are the few sites with no way in on
              record. Spike S6 measures how far walking routes differ from
              straight lines.
            datasets: [os-open-greenspace, openstreetmap]
          - {id: tree-canopy, name: "Tree canopy cover", default_weight: 3, scales: [within-city]}
      - {id: water-nearby, name: "Water nearby", default_weight: 3, scales: [within-city], description: "A river, canal or lake."}
      - {id: urban-heat, name: "Urban heat", default_weight: 3, scales: [within-city]}
      - {id: light-pollution, name: "Light pollution", default_weight: 3, scales: [across-cities]}

  - id: climate
    name: Climate
    description: Weather and climate. They differ between cities, but barely within one.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [across-cities]
