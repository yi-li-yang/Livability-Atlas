        unit: venues
        preference_type: user-direction
        curve: {shape: percentile, better: higher}
        curve_reason: >-
          No standard says how much nightlife is right, and some users want it
          close while others want quiet, so a hex cell scores by its rank within
          the region and the user can flip the direction. It starts with more as
          better.
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          The number of pubs, bars and clubs within a 10-minute walk along
          streets and paths: 800 m at 4.8 km/h, the walking distance the CIHT
          calls acceptable for trips other than commuting. A place is one whose
          Overture category is a pub, a bar of any kind, a lounge, a dance club,
          a karaoke venue, a beer garden or a nightlife venue (leaving out those
          Overture marks permanently closed). Restaurants, cafés and breweries
          are not counted. Overture gives no opening hours, so a daytime pub
          counts the same as a late bar.
        datasets: [overture-places]
      - {id: outdoor-access, name: "Outdoor access", default_weight: 3, scales: [across-cities]}

