    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: culture
        name: Culture
        default_weight: 3
        children:
          - id: cultural-venues-nearby
            name: Cultural venues nearby
            description: The number of galleries, museums, theatres, music venues and cinemas within a 15-minute walk.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: venues
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard says how many are enough, so a hex cell scores by its rank
              within the region: the share of hex cells with fewer. The counts are
              too skewed for a ramp.
            evidence_type: direct
            comparable_across_regions: true
            method: >-
              The number of cultural venues within a 15-minute walk along streets
              and paths: 1,200 m at 4.8 km/h, the preferred maximum walking distance
              for trips other than commuting in Table 3.2 of the CIHT's Guidelines
              for Providing for Journeys on Foot (2000). A venue is a place whose
