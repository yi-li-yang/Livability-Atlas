# The factor tree: every factor a user can weight, from broad to specific.
# Terms are defined in docs/glossary.md.
#
# It started as the seed tree from the approved Phase 0 plan. A factor without
# sub-factors is a measured indicator, and research fills in its unit, scoring
# curve, evidence type and datasets. The field reference, and the rules the
# checks enforce, are in catalogue/README.md.
#
# Weight rules:
# - A top-level factor's default_weight comes from evidence of what people
#   value (D14): how many of five sources weigh it. See
#   docs/specs/2026-10-28-default-weights.md for the five sources, the
#   mapping and the judgement calls it took.
# - A sub-factor keeps the engineering default of 3 until its own evidence
#   separates it, 1 for the two supporting factors, and 0 for choice
#   factors and community composition.
#   A default_weight other than 3 needs a weight_reason.
# - A sub-factor inherits its parent's scales, or lists a subset of them.
# - A measured indicator's status is idea unless stated, and its status
#   decides which fields it needs. A factor with sub-factors has no status of
#   its own.
#
# After editing, refresh the factor explorer and run its tests:
#   node docs/factors/embed-catalogue.mjs
#   node --test "docs/factors/*.test.mjs"

factors:
  - id: housing-and-cost
    name: Housing and cost
    description: What it costs to buy or rent a home, and to live in the area.
    default_weight: 4
    weight_reason: >-
      Four of D14's five sources weigh it: the OECD, Mercer and AARP
      frameworks, and the English Housing Survey's reasons for moving.
    scales: [within-city, across-cities]
    children:
      - id: buying-cost
        name: Buying cost
        description: The price per square metre of the homes sold nearby.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: £ per m²
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: &cost-curve-reason >-
          No standard sets a fair price, and prices differ between regions and
          currencies, so a hex cell scores by its rank within the region. A
          user's budget belongs in a hard limit, not in the curve.
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The median price per square metre of the homes sold in and around the
          hex cell in recent years: each sale's price from HM Land Registry,
          divided by the home's floor area from its energy certificate. Spike S3
          found that pooling the sales of a cell and its neighbours within two
          steps over 24 months gives 20 or more sales in 99% of London's
          homes cells and 40 or more in 95%, against the 37 that a median
          within 15% needs. A cell alone has 5 or more sales a year in only
          37%. How to match sales to certificates within the licences' terms is
          still open: the certificates need a GOV.UK One Login to download in bulk, and
          the match waits for Royal Mail.
        datasets: [hm-land-registry-price-paid, epc-domestic]
      - id: renting-cost
        name: Renting cost
        description: The average monthly private rent in the borough.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: £ a month
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: *cost-curve-reason
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The ONS's average monthly private rent for the local authority, for all
          homes, so every hex cell in a borough shares one value. The ONS also
          breaks rents down by number of bedrooms, which can follow the user's
          home size later. It publishes London rents by postcode district too,
          but warns that its sample is purposive and should not be compared
          between areas, so they stay out of the score. Spike S3 found that a
          model of rent from sale prices predicts a district's rent to within
          7% of the ONS's figure, against 8% for its borough's average, so
          it adds too little to be worth a per-cell value.
        datasets: [ons-private-rents, ons-london-rents-by-district]
      - id: council-tax
        name: Council tax
        description: The Band D council tax of the borough.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: £ a year (Band D)
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: *cost-curve-reason
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The billing authority's average Band D council tax for the current
          year, including precepts such as the Mayor of London's, so every hex
          cell in a borough shares one value. A home's own band sets its real
          bill, so Band D serves only to compare places.
        datasets: [mhclg-council-tax]
      - {id: home-energy-efficiency, name: "Home energy efficiency", default_weight: 3, scales: [within-city]}
      - {id: rent-and-price-levels, name: "Rent and price levels", default_weight: 3, scales: [across-cities]}
      - {id: purchasing-power, name: "Purchasing power", default_weight: 3, scales: [across-cities]}
      - {id: tax-burden, name: "Tax burden", default_weight: 3, scales: [across-cities]}

  - id: transport
    name: Transport
    description: How easily you get around, and how long it takes to reach the places you go.
    default_weight: 3
    weight_reason: "Three of D14's five sources weigh it: the EIU, Mercer and AARP frameworks."
    scales: [within-city, across-cities]
    children:
      - id: getting-around
        name: Getting around in general
        description: The same for every user. Stations, lines and services near each hex cell.
        default_weight: 3
        scales: [within-city]
        children:
          - id: station-proximity
            name: Walk to the nearest station
            description: Walking minutes to the nearest Tube, rail, DLR, Overground, Elizabeth line or tram station.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 6}
            curve_reason: >-
              1 within 6 minutes and 0 at 25 minutes: about 500 m and 2,000 m
              at 4.8 km/h, the desirable and the preferred maximum walking
              distances for commuting in Table 3.2 of the CIHT's Guidelines for
              Providing for Journeys on Foot (2000). 4.8 km/h is the walking
              speed TfL uses for PTAL.
            evidence_type: direct
            comparable_across_regions: true
            method: >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest station entrance, at 4.8 km/h. Spike S6
              measures how far walking routes differ from straight lines.
              The build reads OpenStreetMap's streets and paths that people may walk, joins them into a network, and measures from each cell's centre to the nearest active rail or metro entrance in NaPTAN. A point first walks in a straight line to the nearest street of the main network, which leaves out cut-off fragments such as private estates. On London the walks run a median 1.36 times their straight line, against 1.33 in spike S6, and none is shorter. Cells near the edge of Greater London may overstate the walk, because the streets beyond it are not in the network.
            datasets: [tfl-unified-api, naptan, openstreetmap]
          - id: line-choice
            name: Line choice
            description: How many rail and Tube lines and bus routes run within a short walk.
            default_weight: 3
            children:
              - id: rail-lines-nearby
                name: Rail and Tube lines nearby
                description: Tube, rail, DLR, Overground, Elizabeth line and tram lines at stations within a 12-minute walk.
                default_weight: 3
                status: researched
                unit: lines
                preference_type: fixed
                curve_reason: >-
                  The curve waits for spike S6, which counts the lines near each
                  of London's hex cells. No standard says how many lines are
                  enough, so the thresholds should separate the hex cells.
                evidence_type: direct
                comparable_across_regions: false
                method: >-
                  The number of distinct lines serving stations within a
                  12-minute walk (960 m at 4.8 km/h) along streets and paths,
                  the walk TfL's PTAL allows to a rail or Tube station. National
                  Rail services count as TfL's data lists them. Cities divide
                  their networks into lines differently, so the count does not
                  compare across regions.
                datasets: [tfl-unified-api, openstreetmap]
              - id: bus-routes-nearby
                name: Bus routes nearby
                description: Day bus routes at stops within an 8-minute walk.
                default_weight: 3
                status: researched
                unit: routes
                preference_type: fixed
                curve_reason: >-
                  The curve waits for spike S6, which counts the routes near
                  each of London's hex cells. No standard says how many routes
                  are enough, so the thresholds should separate the hex cells.
                evidence_type: direct
                comparable_across_regions: false
                method: >-
                  The number of distinct day bus routes stopping within an
                  8-minute walk (640 m at 4.8 km/h) along streets and paths, the
                  walk TfL's PTAL allows to a bus stop. Night routes belong to
                  Night and step-free travel.
                datasets: [tfl-unified-api, openstreetmap]
          - id: service-level
            name: Service level
            description: TfL's PTAL index, which combines walking time and service frequency.
            default_weight: 3
            status: built
            unit: PTAL band
            preference_type: fixed
            curve: {shape: lookup, scores: {0: 0, 1a: 0.125, 1b: 0.25, 2: 0.375, 3: 0.5, 4: 0.625, 5: 0.75, 6a: 0.875, 6b: 1}}
            curve_reason: >-
              TfL grades PTAL in nine bands, from 0 (worst) to 6b (best). The
              scores rise in equal steps of 1/8, because TfL gives the bands no
              other weighting.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The PTAL band that covers most of the hex cell, from TfL's 100 m
              grid, with a tie going to the lower band. Spike S1 found that it
              matches the band at the cell's centre in 82% of cells, against
              69% for the band of the cell's mean index. The grid stops at
              Greater London's boundary, so cells beyond it have no value. The
              London Datastore's release is from 2015, before the Elizabeth
              line opened, and TfL's WebCAT team supplies its latest data on
              request.
            datasets: [tfl-ptal]
          - id: travel-cost
            name: Travel cost
            description: The fare zone of the nearest station, which sets the cost of travel to central London.
            default_weight: 3
            status: researched
            unit: fare zone
            preference_type: fixed
            curve: {shape: lookup, scores: {1: 1, 2: 1, 3: 0.89, 4: 0.73, 5: 0.56, 6: 0.49, 7: 0.38, 8: 0.16, 9: 0}}
            curve_reason: >-
              The scores follow TfL's 2026 weekly caps for pay-as-you-go travel
              from zone 1. Zones 1 and 2 score 1, because £44.70 for zones 1–2
              is the lowest cap that includes zone 1, and zone 9 scores 0, at
              £116.40 for zones 1–9, the highest. Between them, a zone's score
              falls in proportion to its cap: zone 4's £64.20 scores 0.73.
              Source: TfL, Adult rate prices 2026. Update the scores when fares
              change.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The fare zone of the nearest Tube, rail, DLR, Overground or
              Elizabeth line station inside TfL's fare zones. A station in two
              zones counts as the lower one.
            datasets: [tfl-unified-api]
          - {id: night-and-step-free, name: "Night and step-free travel", default_weight: 3}
          - {id: cycling, name: "Cycling", default_weight: 3, description: "Protected lanes, cycle-hire docks and slope."}
      - id: travel-time-to-places
        name: Travel time to places
        description: Door-to-door public-transport time to the default places, or to the user's own places.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: minutes
        preference_type: fixed
        curve_reason: >-
          The curve waits for spike S4, which computes London's travel times.
          One candidate is 1 at 15 minutes or less, falling to 0 at 90 minutes:
          the ONS reported in 2014 that personal well-being was lowest for
          commutes of 61 to 90 minutes, against those of 15 minutes or less.
          But the GLA found the effect of commute length small in London
          (Commuting and individual well-being in London, 2015), so the
          thresholds should be checked against how London's hex cells spread.
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          The mean door-to-door time by public transport from the hex cell's
          centre to the default places (D09), on a weekday morning. A user's
          own places get an estimate in the browser instead, labelled with the
          evidence type estimate (D10). Spike S4 picks the routing engine and
          the time of departure.
        datasets: [tfl-unified-api, openstreetmap]
      - {id: airport-connectivity, name: "Airport connectivity", default_weight: 3, scales: [across-cities]}
      - {id: intercity-rail, name: "Intercity rail", default_weight: 3, scales: [across-cities]}

  - id: daily-amenities
    name: Daily amenities
    description: Shops, food and services within an easy walk.
    default_weight: 2
    weight_reason: "Two of D14's five sources weigh it: the Mercer and AARP frameworks."
    scales: [within-city, across-cities]
    children:
      - id: everyday-amenities
        name: Everyday amenities
        description: Everyday shops and services within a 10-minute walk.
        default_weight: 3
        scales: [within-city]
        children:
          - id: groceries
            name: Groceries
            description: Walking minutes to the nearest supermarket, convenience shop or greengrocer.
            default_weight: 3
            status: researched
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: &walk-to-amenity-reason >-
              1 within 5 minutes and 0 at 15 minutes: about 400 m and 1,200 m
              at 4.8 km/h, the desirable and the preferred maximum walking
              distances for trips other than commuting in Table 3.2 of the
              CIHT's Guidelines for Providing for Journeys on Foot (2000).
            evidence_type: direct
            comparable_across_regions: true
            method: &walk-to-amenity-method >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest place of this kind, at 4.8 km/h, from the
              place data's categories, from Overture (leaving out those it
              marks permanently closed) and OpenStreetMap together. Spike S6
              found that a straight line understates a walk: along streets it is
              a median 1.33 times longer, from 1.13 to 1.88 times for 90% of
              routes, and over 1.5 times for 23%, so the walk is measured along
              streets. It also found that the two sources together match 76% of
              the Food Standards Agency's supermarkets and convenience shops by
              name within 100 m (Overture 67%, OpenStreetMap 61%), a lower
              bound, since the register holds legal names.
            datasets: &place-datasets [overture-places, openstreetmap]
          - id: pharmacies
            name: Pharmacies
            description: Walking minutes to the nearest pharmacy.
            default_weight: 3
            status: researched
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *walk-to-amenity-method
            datasets: *place-datasets
          - id: cafes
            name: Cafés
            description: The number of cafés within a 10-minute walk.
            default_weight: 3
            status: spiked
            unit: cafés
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: &count-reason >-
              No standard says how many are enough, so a hex cell scores by its
              rank within the region: the share of hex cells with fewer. Spike
              S6 counted cafés and restaurants within 800 m of London's homes.
              The counts are too skewed for a ramp: the median home has 11
              cafés and 35 restaurants, and the 95th percentile has 76 and 194.
            evidence_type: direct
            comparable_across_regions: true
            method: &count-method >-
              The number of places of this kind within a 10-minute walk along
              streets and paths: 800 m at 4.8 km/h, the walking distance CIHT
              calls acceptable for trips other than commuting. Places come from
              Overture (leaving out those it marks permanently closed) and
              OpenStreetMap together, counting a place once when both list it.
              Spike S6 found that the two together match 66% of the Food
              Standards Agency's cafés, restaurants and takeaways by name
              within 100 m (Overture 60%, OpenStreetMap 43%). That is a lower
              bound, since the register holds legal names, so the counts
              understate.
            datasets: *place-datasets
          - id: gyms
            name: Gyms
            description: Walking minutes to the nearest gym or fitness centre.
            default_weight: 3
            status: researched
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *walk-to-amenity-method
            datasets: *place-datasets
          - id: libraries
            name: Libraries
            description: Walking minutes to the nearest public library.
            default_weight: 3
            status: researched
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *walk-to-amenity-method
            datasets: *place-datasets
      - id: food-and-drink
        name: Food and drink
        description: The choice, variety and quality of places to eat.
        default_weight: 3
        children:
          - id: restaurant-choice
            name: Restaurant choice
            description: The number of restaurants within a 10-minute walk.
            default_weight: 3
            scales: [within-city]
            status: spiked
            unit: restaurants
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: *count-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *count-method
            datasets: *place-datasets
          - id: cuisine-variety
            name: Cuisine variety
            description: The number of different cuisines served by restaurants within a 10-minute walk.
            default_weight: 3
            scales: [within-city]
            status: spiked
            unit: cuisines
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard says how many cuisines are enough, so a hex cell
              scores by its rank within the region: the share of hex cells with
              fewer. Spike S8 counted them within 800 m of London's homes: from
              Overture's categories the median is 12, and the 5th to 95th
              percentile runs from 2 to 41.
            evidence_type: indirect
            comparable_across_regions: true
            method: >-
              The number of distinct cuisines among the restaurants within a
              10-minute walk along streets and paths (800 m at 4.8 km/h), from
              Overture's categories, with OpenStreetMap's cuisine tags to fill
              gaps. Variety is a sign of a lively food scene rather than a
              measure of it, so the evidence type is indirect. Spike S8 found
              that 77% of Overture's restaurants carry a specific cuisine
              category (148 kinds) and 73% of OpenStreetMap's a cuisine tag (264
              values, which need tidying), so Overture leads. No cuisine is
              found near 1% of homes by Overture's categories, and near 18% by
              OpenStreetMap's tags.
            datasets: [overture-places, openstreetmap]
          - {id: your-cuisines, name: "Your cuisines", default_weight: 0, weight_reason: "Choice factor: weight 0 until the user picks cuisines (D18)."}
          - id: food-hygiene
            name: Food hygiene
            description: The share of the food businesses within a 10-minute walk rated good or very good for hygiene.
            default_weight: 3
            scales: [within-city]
            status: spiked
            unit: "% of food businesses"
            preference_type: fixed
            curve: {shape: ramp, t0: 0, t1: 100}
            curve_reason: >-
              The score is the share of nearby food businesses rated 4 (good)
              or 5 (very good) under the Food Hygiene Rating Scheme, whose
              ratings run from 0 to 5.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The share of the food businesses with a rating within a 10-minute
              walk along streets and paths (800 m at 4.8 km/h) that are rated 4
              or 5. Businesses awaiting inspection are left out. Scotland rates
              food hygiene under a different scheme, so the share does not
              compare across regions. Spike S8 found that 98% of London's homes
              cells have 10 or more rated businesses within 800 m, and that the
              share spreads from 69% to 97% across the 5th to 95th percentile
              (median 87%), against 85% good or very good overall.
            datasets: [fsa-food-hygiene-ratings]
          - {id: guide-recognition, name: "Guide recognition", default_weight: 3, description: "Michelin and other guides, through Wikidata."}
          - {id: independents, name: "Independent restaurants", default_weight: 3, scales: [within-city], description: "The share of restaurants that are not chains."}
      - id: brand-presence
        name: Brand presence
        description: Chain brands and shopping centres nearby, as a sign of how large companies rate the area.
        default_weight: 3
        scales: [within-city]
        children:
          - {id: shopping-centres, name: "Shopping centres", default_weight: 3}
          - {id: brand-variety, name: "Brand variety", default_weight: 3}
          - {id: brand-groups, name: "Brand groups", default_weight: 3, description: "Premium, high-footfall, large-catchment and value brands."}
      - {id: shopping, name: "Shopping", default_weight: 3, scales: [across-cities], description: "Shopping centres, and flagship and big-box stores."}
      - {id: destinations, name: "Destinations", default_weight: 0, scales: [within-city], weight_reason: "Choice factor: weight 0 until the user picks destinations (D18). Planned for Phase 2.", description: "Distance to public places or chains the user picks, such as IKEA or the nearest airport."}

  - id: environment
    name: Environment
    description: Air, noise, green space, water and heat where you live.
    default_weight: 4
    weight_reason: "Four of D14's five sources weigh it: the OECD, EIU, Mercer and AARP frameworks."
    scales: [within-city, across-cities]
    children:
      - id: air-quality
        name: Air quality
        default_weight: 3
        children:
          - id: no2
            name: NO₂, annual mean
            description: Nitrogen dioxide in the air, as a yearly average.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: µg/m³
            preference_type: fixed
            curve: {shape: ramp, t0: 40, t1: 10}
            curve_reason: >-
              1 at 10 µg/m³, the WHO's 2021 air quality guideline for the
              annual mean, and 0 at 40 µg/m³, the UK's legal limit for the
              annual mean, which is also the WHO's first interim target.
              Sources: WHO global air quality guidelines (2021); the Air
              Quality Standards Regulations 2010.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The mean, over the hex cell, of the modelled annual mean
              concentration in 2022 from the LAEI, read at 49 points spread
              evenly over the cell, each taking the value of the nearest point
              of the 20 m grid. Spike S5 found for noise that the mean at a
              cell's addresses beats the mean over its area, but could not test
              it on air quality, so the area mean stays until it can. The data
              are modelled from emissions and monitoring, so the evidence type
              is estimate. The LAEI has no stated licence, so commercial builds
              leave this out. The LAEI's 20 m
              grid resolves the higher concentrations beside roads. Defra's
              background maps leave out local sources such as roads, so they
              stand in only where no city dataset exists.
            datasets: [laei, defra-background-maps]
          - id: pm25
            name: PM2.5, annual mean
            description: Fine particles in the air, 2.5 micrometres across or smaller, as a yearly average.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: µg/m³
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 5}
            curve_reason: >-
              1 at 5 µg/m³, the WHO's 2021 air quality guideline for the annual
              mean, and 0 at 25 µg/m³, its second interim target. The first
              interim target, 35 µg/m³, would leave most of the curve unused in
              the UK, where every compliance zone met the legal limit of
              20 µg/m³ in 2023 and 2024. Sources: WHO global air quality
              guidelines (2021); Defra's Air Pollution in the UK reports for
              2023 and 2024.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The mean, over the hex cell, of the modelled annual mean
              concentration in 2022 from the LAEI, read at 49 points spread
              evenly over the cell, each taking the value of the nearest point
              of the 20 m grid. Spike S5 found for noise that the mean at a
              cell's addresses beats the mean over its area, but could not test
              it on air quality, so the area mean stays until it can. The data
              are modelled from emissions and monitoring, so the evidence type
              is estimate. The LAEI has no stated licence, so commercial builds
              leave this out.
            datasets: [laei, defra-background-maps]
      - id: noise
        name: Noise
        description: Daytime noise from roads, railways and aircraft.
        default_weight: 3
        scales: [within-city]
        children:
          - id: road-noise
            name: Road traffic noise
            description: The average noise level from road traffic, from 7 am to 11 pm.
            default_weight: 3
            status: built
            unit: dB (daytime)
            preference_type: fixed
            curve: {shape: ramp, t0: 70, t1: 50}
            curve_reason: >-
              1 at 50 dB and 0 at 70 dB: the daytime levels at which ProPG, the
              professional guidance on noise for new homes in England (ANC, IOA
              and CIEH, 2017), places a site at negligible and at high risk.
              ProPG applies its scale to all transport noise together, and here
              it scores each source alone.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The modelled daytime level, LAeq,16h from 07:00 to 23:00, from
              Defra's strategic noise maps, at the cell's address points: the
              arithmetic mean, in dB, of the level at each address, with levels
              below the maps' 40 dB cut-off counted as 40 dB. A cell with no
              address, such as a park, takes the arithmetic mean over its
              area. Spike S5 found that this matches the average of the
              addresses' own scores almost exactly (rank correlation 0.97),
              and that averaging over the cell's area does not (0.76 for the
              arithmetic mean, 0.82 for the sound energy mean, 0.75 for the
              highest pixel). The noise is modelled, so the evidence type is
              estimate.
            datasets: [defra-road-noise]
          - id: rail-noise
            name: Rail noise
            description: The average noise level from railways, from 7 am to 11 pm.
            default_weight: 3
            status: built
            unit: dB (daytime)
            preference_type: fixed
            curve: {shape: ramp, t0: 70, t1: 50}
            curve_reason: >-
              1 at 50 dB and 0 at 70 dB: the daytime levels at which ProPG, the
              professional guidance on noise for new homes in England (ANC, IOA
              and CIEH, 2017), places a site at negligible and at high risk.
              ProPG applies its scale to all transport noise together, and here
              it scores each source alone.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The modelled daytime level, LAeq,16h from 07:00 to 23:00, from
              Defra's strategic noise maps, at the cell's address points: the
              arithmetic mean, in dB, of the level at each address, with levels
              below the maps' 40 dB cut-off counted as 40 dB. A cell with no
              address, such as a park, takes the arithmetic mean over its
              area. Spike S5 found, for road noise, that this matches the average of the
              addresses' own scores almost exactly (rank correlation 0.97),
              and that averaging over the cell's area does not (0.76 for the
              arithmetic mean, 0.82 for the sound energy mean, 0.75 for the
              highest pixel). The noise is modelled, so the evidence type is
              estimate.
            datasets: [defra-rail-noise]
          - id: aircraft-noise
            name: Aircraft noise
            description: The average noise level from aircraft, from 7 am to 11 pm.
            default_weight: 3
            status: built
            unit: dB (daytime)
            preference_type: fixed
            curve: {shape: ramp, t0: 63, t1: 51}
            curve_reason: >-
              1 at 51 dB, the lowest level at which the government finds
              adverse effects from aircraft noise (Air Navigation Guidance,
              2017), and 0 at 63 dB, the level at which it expects airports to
              help insulate homes (Aviation Policy Framework, 2013, paragraph
              3.39). Aircraft noise has its own thresholds: the WHO's 2018
              guidelines also set a lower level for it than for road or rail
              noise.
            evidence_type: estimate
            comparable_across_regions: true
            method: >-
              The modelled daytime level, LAeq,16h from 07:00 to 23:00, from
              Defra's strategic noise maps of airports, at the cell's address
              points, averaged as road noise is. Each airport's operator
              modelled its own map, so the lowest level mapped varies by
              airport, and away from the airports the maps cover, aircraft
              noise counts as their 40 dB cut-off. Spike S5 tested the
              averaging on road noise only.
            datasets: [defra-airport-noise]
      - id: green-space
        name: Green space
        default_weight: 3
        children:
          - id: walk-to-green-space
            name: Walk to a green space
            description: Walking minutes to the nearest public park or other green space of at least 2 hectares.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 4}
            curve_reason: >-
              1 within 4 minutes and 0 at 15 minutes: about 300 m and 1,200 m at
              4.8 km/h. Natural England's Accessible Greenspace Standard (2024)
              asks for a natural green space of at least 2 ha within 300 m of
              home, and 1,200 m is the preferred maximum walking distance for
              trips other than commuting in Table 3.2 of the CIHT's Guidelines
              for Providing for Journeys on Foot (2000).
            evidence_type: direct
            comparable_across_regions: true
            method: >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest way in on foot to a public park or playing
              field of at least 2 ha, natural or not, at 4.8 km/h, from OS Open
              Greenspace. Play spaces, sports facilities, allotments and
              cemeteries are left out, as are the few sites with no way in on
              record. Spike S6 measures how far walking routes differ from
              straight lines.
            datasets: [os-open-greenspace, openstreetmap]
          - {id: tree-canopy, name: "Tree canopy cover", default_weight: 3, scales: [within-city]}
      - {id: water-nearby, name: "Water nearby", default_weight: 3, scales: [within-city], description: "A river, canal or lake."}
      - {id: urban-heat, name: "Urban heat", default_weight: 3, scales: [within-city]}
      - {id: light-pollution, name: "Light pollution", default_weight: 3, scales: [across-cities]}

  - id: climate
    name: Climate
    description: Weather and climate. They differ between cities, but barely within one.
    default_weight: 1
    weight_reason: "None of D14's five sources gives climate its own category, so it takes the floor of 1."
    scales: [across-cities]
    children:
      - {id: temperature, name: "Temperature", default_weight: 3}
      - {id: sunshine, name: "Sunshine duration", default_weight: 3, description: "Hours of sunshine, per year and per month."}
      - {id: daylight, name: "Daylight length", default_weight: 3}
      - {id: humidity, name: "Humidity", default_weight: 3}
      - {id: rain, name: "Rain", default_weight: 3}
      - {id: wind, name: "Wind", default_weight: 3}
      - {id: snow, name: "Snow", default_weight: 3}
      - {id: weather-extremes, name: "Weather extremes", default_weight: 3}
      - {id: future-climate, name: "Future climate", default_weight: 3}

  - id: natural-hazards
    name: Natural hazards
    description: Risks from floods, ground movement and other natural events.
    default_weight: 1
    weight_reason: "Only the AARP framework names it, under disaster risk, so it takes the floor of 1."
    scales: [within-city, across-cities]
    children:
      - id: flood-risk
        name: Flood risk
        default_weight: 3
        scales: [within-city]
        children:
          - id: river-and-sea-flooding
            name: Rivers and sea
            description: The share of the area with at least a 1 in 100 chance of flooding from rivers or the sea in any year.
            default_weight: 3
            status: built
            unit: "% of the area"
            preference_type: fixed
            curve: {shape: ramp, t0: 100, t1: 0}
            curve_reason: &flood-curve-reason >-
              The score is the share of the hex cell outside the Environment
              Agency's medium and high bands, which mean a chance of 1 in 100 or
              more of flooding in any year. The low and very low bands, below 1
              in 100, count as safe.
            evidence_type: estimate
            comparable_across_regions: false
            method: >-
              The share of the hex cell's area in the medium or high band of the
              Environment Agency's 2 m grid, which counts flood defences and the
              chance that they fail. Spike S5 decides whether to weight the
              share by homes instead of area. The risk is modelled, so the
              evidence type is estimate, and countries model and count defences
              differently, so the share does not compare across regions.
              The Environment Agency serves the bands as a map, not as polygons, so the build draws the region at 10 m a pixel, reads each band off its colour, and takes the share of 49 points spread over the hex cell that fall in the medium or high band. Outlines are not a band and are left out of the count.
            datasets: [ea-flood-risk-rivers-sea]
          - id: surface-water-flooding
            name: Surface water
            description: The share of the area with at least a 1 in 100 chance of flooding from rainwater in any year.
            default_weight: 3
            status: built
            unit: "% of the area"
            preference_type: fixed
            curve: {shape: ramp, t0: 100, t1: 0}
            curve_reason: *flood-curve-reason
            evidence_type: estimate
            comparable_across_regions: false
            method: >-
              The share of the hex cell's area in the medium or high band of the
              Environment Agency's 2 m grid of flooding from surface water, when
              heavy rain cannot drain away. Spike S5 decides whether to weight
              the share by homes instead of area. The risk is modelled, so the
              evidence type is estimate, and it does not compare across regions.
              The Environment Agency serves the bands as a map, not as polygons, so the build draws the region at 10 m a pixel, reads each band off its colour, and takes the share of 49 points spread over the hex cell that fall in the medium or high band. Outlines are not a band and are left out of the count.
            datasets: [ea-flood-risk-surface-water]
      - {id: subsidence, name: "Subsidence", default_weight: 3, scales: [within-city]}
      - {id: earthquakes, name: "Earthquakes", default_weight: 3, scales: [across-cities]}
      - {id: storms, name: "Storms", default_weight: 3, scales: [across-cities]}
      - {id: wildfire, name: "Wildfire", default_weight: 3, scales: [across-cities]}
      - {id: sea-level-rise, name: "Sea-level rise", default_weight: 3, scales: [across-cities]}

  - id: safety
    name: Safety
    description: Crime and road danger.
    default_weight: 4
    weight_reason: "Four of D14's five sources weigh it: the OECD, EIU, Mercer and AARP frameworks."
    scales: [within-city, across-cities]
    children:
      - id: crime
        name: Crime
        description: Recorded crime and anti-social behaviour nearby, as rates, by kind.
        default_weight: 3
        scales: [within-city]
        children:
          - id: burglary
            name: Burglary
            description: Recorded burglaries, as a rate per resident.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: &crime-curve-reason >-
              No standard sets a safe level of crime, and countries record crime
              differently, so a hex cell scores by its rank within the region:
              the share of hex cells with a higher rate.
            evidence_type: direct
            comparable_across_regions: false
            method: &crime-method >-
              Police.uk's recorded crimes of this kind over the last 12 months,
              counted at their anonymised map points, per 1,000 residents.
              Residents come from Census 2021's output areas, shared between
              the hex cells each one overlaps in proportion to the overlap:
              placing an output area's residents at its centroid left 38% of
              London's cells empty. A cell's rate pools the crimes and the
              residents of the cell and its neighbours within two steps (about
              an 8-minute walk), and adds 3,000 residents at the London-wide
              rate, so that a cell with few residents around it does not top
              the ranking on a handful of crimes. Spike S2 chose these by how
              well two halves of the year agree. The rate per resident
              overstates crime where few people live and many work or visit,
              as in the City of London, and spike S2 left that open. Not every
              crime is reported, and recording varies between police forces.
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
          - id: violence-and-sexual-offences
            name: Violence and sexual offences
            description: Recorded violent and sexual crimes, as a rate per resident.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: *crime-method
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
          - id: robbery-and-theft-from-the-person
            name: Robbery and theft from the person
            description: Robbery, and theft such as pickpocketing and bag snatching, as a rate per resident.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: *crime-method
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
          - id: vehicle-crime
            name: Vehicle crime
            description: Theft of and from vehicles, as a rate per resident.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: *crime-method
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
          - id: anti-social-behaviour
            name: Anti-social behaviour
            description: Incidents of anti-social behaviour reported to the police, as a rate per resident.
            default_weight: 3
            status: built
            unit: incidents a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              Police.uk's incidents of anti-social behaviour over the last 12
              months, counted at their anonymised map points, per 1,000
              residents from Census 2021, smoothed over neighbouring hex cells
              as for crime (spike S2). Not every incident is reported, and
              Police.uk notes that some forces may count some incidents twice.
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
      - {id: road-collisions, name: "Road collisions", default_weight: 3, scales: [within-city]}
      - {id: homicide-rate, name: "Homicide rate", default_weight: 3, scales: [across-cities]}
      - {id: political-stability, name: "Political stability", default_weight: 3, scales: [across-cities]}

  - id: health-care
    name: Health care
    description: Access to GPs, hospitals and dentists.
    default_weight: 4
    weight_reason: "Four of D14's five sources weigh it: the OECD, EIU, Mercer and AARP frameworks."
    scales: [within-city, across-cities]
    children:
      # GP access sits here, not under Daily amenities. Life expectancy sits under Resident wellbeing.
      - id: gp-access
        name: GP access
        description: How near a GP practice is, and how many patients each GP serves.
        default_weight: 3
        scales: [within-city]
        children:
          - id: gp-walk
            name: Walk to a GP practice
            description: Walking minutes to the nearest GP practice.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest GP practice or branch surgery, at 4.8 km/h.
              NHS England's registers give the postcode of each active GP
              practice and each open branch surgery of one, and Ordnance
              Survey's Code-Point Open turns the postcode into a place.
              Vaccination sites listed as branches are left out. The registers
              cover England only, which is why this measured indicator does not
              compare across regions. A postcode places a practice at the
              middle of its postcode, a few tens of metres at most.
            datasets: [nhs-ods, os-code-point-open, openstreetmap]
          - id: gp-list-size
            name: Patients per GP
            description: How many registered patients each full-time GP nearby serves.
            default_weight: 3
            status: researched
            unit: patients per full-time GP
            preference_type: fixed
            curve_reason: >-
              The good end has a source and the other end does not. The
              Healthy Urban Development Unit's planning model (NHS London
              HUDU) plans for one GP per 1,800 patients, so 1,800 is where the
              score would start to fall. No source says where access becomes
              poor. An Oxford study of NHS England's workforce data, Counting
              general practitioners (data from 2015 to 2024), found the 5th to
              95th percentile of patients per fully qualified full-time GP
              ran from 1,357 to 5,559 across England. The other end waits for
              how this measure spreads across London's hex cells once the data
              is built.
            evidence_type: indirect
            comparable_across_regions: false
            method: >-
              For each hex cell, the registered patients of every GP practice
              within a 15-minute walk (1,200 m at 4.8 km/h), divided by those
              practices' full-time fully qualified GPs (trainees excluded),
              from the latest month. It is indirect: it shows how easy an
              appointment is likely to be, and does not count appointments. A
              cell with no practice in reach has no value here, because the
              walk to a GP practice already scores it. The register covers
              England only.
            datasets: [nhs-gp-registered-patients, nhs-gp-workforce, nhs-ods, os-code-point-open]
      - id: ae-distance
        name: Distance to A&E
        description: How far the nearest hospital with a 24-hour emergency department is.
        default_weight: 3
        scales: [within-city]
        status: researched
        unit: km in a straight line
        preference_type: fixed
        curve_reason: >-
          No standard sets a distance. Nicholl and colleagues (Emergency
          Medicine Journal, 2007, volume 24, pages 665 to 668) followed 10,315
          emergency patients taken to hospital by four English ambulance
          services, and found that each extra 10 km of straight-line distance
          went with about a 1% higher absolute risk of death, with no
          threshold. Their data are from 1997 to 2001, and the Patients
          Association has criticised the design. A ramp needs a distance at
          which the score is 0, and none has a source, so the curve waits for
          how distances spread across London's hex cells once the data is built.
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          The straight line from the hex cell's centre to the nearest hospital
          with a type 1 emergency department: consultant-led, open 24 hours,
          with full resuscitation facilities, as NHS England defines it. It is
          a straight line because the evidence is in straight-line distance.
          Hospitals come from OpenStreetMap, where those with an emergency
          department carry the tag emergency=yes, and NHS England's list of
          trust sites cross-checks them. NHS England publishes no list of
          emergency departments by site. Spike S6 compares how complete the
          sources are.
        datasets: [openstreetmap, nhs-ods]
      # Dentists stay an idea: where practices are is open, but whether they take new NHS patients is not.
      - {id: dentists, name: "Dentists", default_weight: 3, scales: [within-city]}
      - {id: health-care-quality, name: "Health-care quality and cost", default_weight: 3, scales: [across-cities]}

  - id: education
    name: Education
    description: Schools, nurseries and universities.
    default_weight: 4
    weight_reason: "Four of D14's five sources weigh it: the OECD, EIU, Mercer and AARP frameworks."
    scales: [within-city, across-cities]
    children:
      - id: schools
        name: Schools
        description: State schools nearby, by phase, and how their inspections went.
        default_weight: 3
        scales: [within-city]
        children:
          - id: primary-schools
            name: Primary schools
            description: Walking minutes to the nearest state primary school.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 6}
            curve_reason: &school-walk-reason >-
              1 within 6 minutes and 0 at 25 minutes: about 500 m and 2,000 m
              at 4.8 km/h, the desirable and the preferred maximum walking
              distances for school trips in Table 3.2 of the CIHT's Guidelines
              for Providing for Journeys on Foot (2000).
            evidence_type: direct
            comparable_across_regions: true
            method: &school-walk-method >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest open state-funded school of this phase, from
              the DfE's register of schools, at 4.8 km/h. Admission follows each
              school's own criteria, often distance, so the nearest school is
              not always one a child can attend.
            datasets: [dfe-gias, openstreetmap]
          - id: secondary-schools
            name: Secondary schools
            description: Walking minutes to the nearest state secondary school.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 6}
            curve_reason: *school-walk-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *school-walk-method
            datasets: [dfe-gias, openstreetmap]
          - id: school-inspections
            name: School inspection results
            description: The share of nearby state schools whose latest Ofsted inspection meets the standard.
            default_weight: 3
            status: researched
            unit: "% of nearby schools"
            preference_type: fixed
            curve_reason: >-
              The curve waits for a definition of meeting the standard that spans
              Ofsted's frameworks. Since 10 November 2025, report cards grade up
              to eight areas on a five-point scale, from urgent improvement to
              exceptional, and Ofsted says these grades do not compare directly
              with earlier ones. One candidate is the expected standard or
              better in every graded area, matched with good or better under
              the earlier framework, decided once report cards cover more
              schools.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The share of the state-funded schools within a 2,000 m walk whose
              latest inspection meets the standard, from Ofsted's monthly
              records of each school's latest inspection. Ofsted inspects
              schools in England only, so the share does not compare across
              regions.
              The build reads the register's open, state-funded, mainstream schools (local authority maintained schools, academies and free schools, leaving out special schools, alternative provision, nurseries and sixth-form centres), and measures along the streets and paths of OpenStreetMap from the cell's centre to the nearest school of the phase, as for the station walk. An all-through school counts for both phases.
              The build reads the register's open, state-funded, mainstream schools (local authority maintained schools, academies and free schools, leaving out special schools, alternative provision, nurseries and sixth-form centres), and measures along the streets and paths of OpenStreetMap from the cell's centre to the nearest school of the phase, as for the station walk. An all-through school counts for both phases.
            datasets: [ofsted-school-inspections, dfe-gias]
      - {id: nurseries, name: "Nurseries", default_weight: 3, scales: [within-city]}
      - {id: school-league-tables, name: "School league tables", default_weight: 3, scales: [within-city]}
      - {id: school-quality, name: "School quality", default_weight: 3, scales: [across-cities]}
      - {id: international-schools, name: "International schools", default_weight: 3, scales: [across-cities]}
      - {id: universities, name: "Universities", default_weight: 3, scales: [across-cities]}

  - id: community-and-people
    name: Community and people
    description: Who lives nearby, and the community life they share.
    default_weight: 2
    weight_reason: >-
      Two of D14's five sources weigh it: the OECD's community topic (ties to
      friends and family) and the AARP framework's civic life.
    scales: [within-city, across-cities]
    children:
      - id: community-composition
        name: Community composition
        description: Framed as the presence of a group the user picks, and as diversity (D08).
        default_weight: 0
        weight_reason: Starts at 0, so composition counts only if the user asks for it (D08).
        children:
          - id: your-community
            name: Your community
            description: The presence of a group the user picks, by ethnic group, religion, country of birth, main language or age.
            default_weight: 0
            weight_reason: "Choice factor: weight 0 until the user picks a group (D18)."
            scales: [within-city]
            status: researched
            unit: "% of residents"
            preference_type: user-choice
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard sets how present a group should be, so a hex cell
              scores by its rank within the region by the share of residents in
              the chosen group. Only presence scores: the direction is fixed, so
              a group's absence never adds to a score (D08).
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The share of residents in the chosen group, from Census 2021 by
              output area, combined over the output areas that overlap the hex
              cell, weighted by residents. The groups are the census's own
              categories, which differ between countries, so the share does not
              compare across regions.
            datasets: &census-composition-datasets [ons-census-2021-topic-summaries, ons-output-area-boundaries]
          - id: diversity
            name: Diversity
            description: How mixed the area's residents are by ethnic group.
            default_weight: 3
            scales: [within-city]
            status: researched
            unit: diversity index, from 0 to 1
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard sets a level of diversity, so a hex cell scores by its
              rank within the region. The direction is fixed, because D08 frames
              composition as the presence of a chosen group and as diversity,
              never as fewer of any group.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              Simpson's diversity index over the census's 19 ethnic groups: the
              chance that two residents picked at random belong to different
              groups. It uses Census 2021 by output area, over the output areas
              that overlap the hex cell, weighted by residents. The groups are
              the census's own, so the index does not compare across regions.
            datasets: *census-composition-datasets
      - id: faith
        name: Faith
        description: Walking minutes to the nearest place of worship of the user's faith.
        default_weight: 0
        scales: [within-city]
        weight_reason: "Choice factor: weight 0 until the user picks a faith (D18)."
        status: researched
        unit: minutes on foot
        preference_type: user-choice
        curve: {shape: ramp, t0: 15, t1: 5}
        curve_reason: *walk-to-amenity-reason
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          The walking time along streets and paths from the hex cell's centre to
          the nearest place of worship of the chosen faith, at 4.8 km/h, from the
          religion that the place data records. Residents who share the faith
          count under Your community, by religion. Spike S6 checks how complete
          the religion tags are.
        datasets: [openstreetmap, overture-places]
      - id: community-life
        name: Community life
        default_weight: 3
        scales: [within-city]
        children:
          - {id: community-spaces, name: "Community spaces", default_weight: 3}
          - {id: lgbtq-friendly-venues, name: "LGBTQ+-friendly venues", default_weight: 3}
          - {id: election-turnout, name: "Local election turnout", default_weight: 3}
          - {id: residents-stay, name: "How long residents stay", default_weight: 3}
      - {id: english-proficiency, name: "English proficiency", default_weight: 3, scales: [across-cities]}
      - {id: expat-communities, name: "Expat communities", default_weight: 3, scales: [across-cities]}
      - {id: religious-freedom, name: "Religious freedom", default_weight: 3, scales: [across-cities]}
      - {id: gender-equality, name: "Gender equality", default_weight: 3, scales: [across-cities]}

  - id: culture-and-leisure
    name: Culture and leisure
    description: Culture, nightlife and things to do.
    default_weight: 2
    weight_reason: "Two of D14's five sources weigh it: the EIU and Mercer frameworks."
    scales: [within-city, across-cities]
    children:
      - id: culture
        name: Culture
        default_weight: 3
        children:
          - {id: cultural-venues-nearby, name: "Cultural venues within a 15-minute walk", default_weight: 3, scales: [within-city]}
          - {id: cultural-venues-in-reach, name: "Cultural venues within 30 minutes by public transport", default_weight: 3, scales: [within-city]}
          - {id: local-character, name: "Local character", default_weight: 3, scales: [within-city], description: "Listed buildings and conservation areas."}
          - {id: cultural-activity, name: "Cultural activity", default_weight: 3, scales: [within-city], description: "Events, and well-known places on Wikipedia."}
      - {id: nightlife, name: "Nightlife", default_weight: 3, description: "Some users want it nearby and others want quiet, so the user sets the direction."}
      - {id: outdoor-access, name: "Outdoor access", default_weight: 3, scales: [across-cities]}

