  - id: natural-hazards
    name: Natural hazards
    description: Risks from floods, ground movement and other natural events.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: flood-risk
        name: Flood risk
        default_weight: 3
        scales: [within-city]
        children:
          - id: river-and-sea-flooding
            name: Rivers and sea
            description: The share of the area with at least a 1 in 100 chance of flooding from rivers or the sea in any year.
            default_weight: 3
            status: built
            unit: "% of the area"
            preference_type: fixed
            curve: {shape: ramp, t0: 100, t1: 0}
            curve_reason: &flood-curve-reason >-
              The score is the share of the hex cell outside the Environment
              Agency's medium and high bands, which mean a chance of 1 in 100 or
              more of flooding in any year. The low and very low bands, below 1
              in 100, count as safe.
            evidence_type: estimate
            comparable_across_regions: false
            method: >-
              The share of the hex cell's area in the medium or high band of the
              Environment Agency's 2 m grid, which counts flood defences and the
              chance that they fail. Spike S5 decides whether to weight the
              share by homes instead of area. The risk is modelled, so the
              evidence type is estimate, and countries model and count defences
              differently, so the share does not compare across regions.
              The Environment Agency serves the bands as a map, not as polygons, so the build draws the region at 10 m a pixel, reads each band off its colour, and takes the share of 49 points spread over the hex cell that fall in the medium or high band. Outlines are not a band and are left out of the count.
            datasets: [ea-flood-risk-rivers-sea]
          - id: surface-water-flooding
            name: Surface water
            description: The share of the area with at least a 1 in 100 chance of flooding from rainwater in any year.
            default_weight: 3
            status: built
            unit: "% of the area"
            preference_type: fixed
            curve: {shape: ramp, t0: 100, t1: 0}
            curve_reason: *flood-curve-reason
            evidence_type: estimate
            comparable_across_regions: false
            method: >-
              The share of the hex cell's area in the medium or high band of the
              Environment Agency's 2 m grid of flooding from surface water, when
              heavy rain cannot drain away. Spike S5 decides whether to weight
              the share by homes instead of area. The risk is modelled, so the
              evidence type is estimate, and it does not compare across regions.
              The Environment Agency serves the bands as a map, not as polygons, so the build draws the region at 10 m a pixel, reads each band off its colour, and takes the share of 49 points spread over the hex cell that fall in the medium or high band. Outlines are not a band and are left out of the count.
            datasets: [ea-flood-risk-surface-water]
      - {id: subsidence, name: "Subsidence", default_weight: 3, scales: [within-city]}
      - {id: earthquakes, name: "Earthquakes", default_weight: 3, scales: [across-cities]}
      - {id: storms, name: "Storms", default_weight: 3, scales: [across-cities]}
      - {id: wildfire, name: "Wildfire", default_weight: 3, scales: [across-cities]}
      - {id: sea-level-rise, name: "Sea-level rise", default_weight: 3, scales: [across-cities]}

  - id: safety
    name: Safety
    description: Crime and road danger.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: crime
        name: Crime
        description: Recorded crime and anti-social behaviour nearby, as rates, by kind.
        default_weight: 3
        scales: [within-city]
        children:
          - id: burglary
            name: Burglary
            description: Recorded burglaries, as a rate per resident.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: &crime-curve-reason >-
              No standard sets a safe level of crime, and countries record crime
              differently, so a hex cell scores by its rank within the region:
              the share of hex cells with a higher rate.
            evidence_type: direct
            comparable_across_regions: false
            method: &crime-method >-
              Police.uk's recorded crimes of this kind over the last 12 months,
              counted at their anonymised map points, per 1,000 residents.
              Residents come from Census 2021's output areas, shared between
              the hex cells each one overlaps in proportion to the overlap:
              placing an output area's residents at its centroid left 38% of
              London's cells empty. A cell's rate pools the crimes and the
              residents of the cell and its neighbours within two steps (about
              an 8-minute walk), and adds 3,000 residents at the London-wide
              rate, so that a cell with few residents around it does not top
              the ranking on a handful of crimes. Spike S2 chose these by how
              well two halves of the year agree. Burglary and vehicle crime are
              counted per resident, since a home is burgled and a car is
              stolen where people live, and the other three kinds per resident
              and worker (see violence and sexual offences). Not every crime is
              reported, and recording varies between police forces.
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
          - id: violence-and-sexual-offences
            name: Violence and sexual offences
            description: Recorded violent and sexual crimes, as a rate per resident and worker.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents and workers
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: &crime-people-method >-
              Police.uk's recorded crimes of this kind over the last 12 months,
              counted at their anonymised map points, per 1,000 residents and
              workers together. A person is assaulted, robbed or hounded where
              people are, and in a centre such as the City of London most of
              them work or visit: counted per resident alone, the City topped
              every rate (spike S2). Residents come from Census 2021's output
              areas and workers from the Business Register and Employment
              Survey's jobs (2024, rounded to the nearest 25, by 2011 LSOA),
              each shared between the hex cells it overlaps in proportion to
              the overlap, then added. A cell's rate pools the crimes and the
              people of the cell and its neighbours within two steps (about an
              8-minute walk) and adds 3,000 people at the London-wide rate, as
              for the other crime rates. A worker who lives in London counts
              twice, once at home and once at work, and visitors and people out
              at night are not counted at all, so the rate is still highest in
              the busiest centres, but no longer by the arithmetic of a few
              residents. Not every crime is reported, and recording varies
              between police forces.
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries, ons-bres, ons-lsoa-boundaries]
          - id: robbery-and-theft-from-the-person
            name: Robbery and theft from the person
            description: Robbery, and theft such as pickpocketing and bag snatching, as a rate per resident and worker.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents and workers
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: *crime-people-method
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries, ons-bres, ons-lsoa-boundaries]
          - id: vehicle-crime
            name: Vehicle crime
            description: Theft of and from vehicles, as a rate per resident.
            default_weight: 3
            status: built
            unit: crimes a year per 1,000 residents
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: *crime-method
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries]
          - id: anti-social-behaviour
            name: Anti-social behaviour
            description: Incidents of anti-social behaviour reported to the police, as a rate per resident and worker.
            default_weight: 3
            status: built
            unit: incidents a year per 1,000 residents and workers
            preference_type: fixed
            curve: {shape: percentile, better: lower}
            curve_reason: *crime-curve-reason
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              Police.uk's incidents of anti-social behaviour over the last 12
              months, counted at their anonymised map points, per 1,000
              residents and workers (Census 2021 residents and the Business
              Register and Employment Survey's jobs), smoothed over
              neighbouring hex cells as for crime (spike S2, and the method of
              violence and sexual offences). Not every incident is reported,
              and Police.uk notes that some forces may count some incidents
              twice.
            datasets: [police-uk, ons-census-2021-residents, ons-output-area-boundaries, ons-bres, ons-lsoa-boundaries]
      - id: road-collisions
        name: Road collisions
        description: Fatal and serious road collisions near the hex cell.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: fatal or serious collisions a year per 1,000 residents and workers
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: >-
          No standard sets a safe number of collisions, and countries record
          them differently, so a hex cell scores by its rank within the region:
          the share of hex cells with a higher rate.
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The collisions that killed or seriously injured someone in the
          Department for Transport's road safety data (STATS19) over the latest
          three full years (2022 to 2024), at the place the police recorded
          each, averaged to a year, per 1,000 residents and workers together
          (Census 2021 residents and the Business Register and Employment
          Survey's jobs, shared between hex cells by area, as for crime). A
          cell's rate pools the collisions and the people of the cell and its
          neighbours within two steps and adds 3,000 people at the London-wide
          rate, as the crime rates do. Only fatal and serious collisions are
          counted, because the police record slight injuries less reliably. A
          collision is recorded only when it is reported to the police. The
          rate is per person, not per mile travelled, so a main road through a
          quiet area adds to its neighbours' rates.
        datasets: [dft-stats19, ons-census-2021-residents, ons-output-area-boundaries, ons-bres, ons-lsoa-boundaries]
      - {id: homicide-rate, name: "Homicide rate", default_weight: 3, scales: [across-cities]}
      - {id: political-stability, name: "Political stability", default_weight: 3, scales: [across-cities]}

  - id: health-care
    name: Health care
    description: Access to GPs, hospitals and dentists.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      # GP access sits here, not under Daily amenities. Life expectancy sits under Resident wellbeing.
      - id: gp-access
        name: GP access
        description: How near a GP practice is, and how many patients each GP serves.
        default_weight: 3
        scales: [within-city]
        children:
          - id: gp-walk
            name: Walk to a GP practice
            description: Walking minutes to the nearest GP practice.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest GP practice or branch surgery, at 4.8 km/h.
              NHS England's registers give the postcode of each active GP
              practice and each open branch surgery of one, and Ordnance
              Survey's Code-Point Open turns the postcode into a place.
              Vaccination sites listed as branches are left out. The registers
              cover England only, which is why this measured indicator does not
              compare across regions. A postcode places a practice at the
              middle of its postcode, a few tens of metres at most.
            datasets: [nhs-ods, os-code-point-open, openstreetmap]
          - id: gp-list-size
            name: Patients per GP
            description: How many registered patients each full-time GP nearby serves.
            default_weight: 3
            status: built
            unit: patients per full-time GP
            preference_type: fixed
            curve: {shape: ramp, t0: 5559, t1: 1800}
            curve_reason: >-
              Both ends have a source. The Healthy Urban Development Unit's
              planning model (NHS London HUDU) plans for one GP per 1,800
              patients, so 1,800 scores in full. An Oxford study of NHS
              England's workforce data, Counting general practitioners (data
              from 2015 to 2024), found the 95th percentile of patients per
              fully qualified full-time GP across England to be 5,559, so that
              scores 0: it is a mark of the worst-served 1 in 20, not a
              threshold of harm, which no source sets. London's cells agree
              (built data: median 2,394, 95th percentile 4,459).
            evidence_type: indirect
            comparable_across_regions: false
            method: >-
              For each hex cell, the registered patients of every GP practice
              within a 15-minute walk (1,200 m at 4.8 km/h, along streets and
              paths), divided by those practices' full-time fully qualified GPs
              (partners, salaried GPs, locums and retainers; trainees
              excluded), from September 2026. A practice is placed at its main
              postcode, and its branch surgeries' patients are counted there.
              It is indirect: it shows how easy an appointment is likely to
              be, and does not count appointments. A cell with no practice in
              reach, or whose practices have no GP on record, has no value
              here, because the walk to a GP practice already scores the
              first. The register covers England only.
            datasets: [nhs-gp-registered-patients, nhs-gp-workforce, os-code-point-open]
      - id: ae-distance
        name: Distance to A&E
        description: How far the nearest hospital with a 24-hour emergency department is.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: km in a straight line
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: >-
          No standard sets a distance. Nicholl and colleagues (Emergency
          Medicine Journal, 2007, volume 24, pages 665 to 668) followed 10,315
          emergency patients taken to hospital by four English ambulance
          services, and found that each extra 10 km of straight-line distance
          went with about a 1% higher absolute risk of death, with no
          threshold. Their data are from 1997 to 2001, and the Patients
          Association has criticised the design. A ramp needs a distance at
          which the score is 0, and none has a source, so a hex cell scores by
          its rank within the region: the share of hex cells that are farther.
          London's cells are 0.05 to 11.9 km from a department (median 3.5 km,
          95th percentile 7.5 km), so the differences are small beside the
          study's 10 km, and the rank shows them as a ranking, not as a risk.
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          The straight line from the hex cell's centre to the nearest hospital
          with an emergency department open 24 hours, which NHS England counts
          as a type 1 department. It is a straight line because the evidence is
          in straight-line distance. NHS England publishes no list of
          emergency departments by site, so the departments come from the NHS
          website's "Find your nearest A&E", which lists them with the NHS
          organisation code, the address and the opening hours: about ten
          searches from places across the region list every department in and
          around it, 64 of them for London and its surroundings. A department
          is placed at its postcode (Code-Point Open). Departments for children
          only or for adults only count, as do those outside the region, so a
          cell at the edge measures to the nearest one across the boundary.
        datasets: [nhs-find-an-ae, os-code-point-open]
      # Dentists stay an idea: where practices are is open, but whether they take new NHS patients is not.
      - id: dentists
        name: Dentists
        description: Walking minutes to the nearest dental practice.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: minutes on foot
        preference_type: fixed
        curve: {shape: percentile, better: lower}
        curve_reason: >-
          No source says how far from a dentist is too far, and people travel
          further to a dentist than to a GP, so the 15-minute ramp of the walk
          to a GP does not carry over. A hex cell scores by its rank within the
          region: the share of cells that are further from a practice.
        evidence_type: indirect
        comparable_across_regions: false
        method: >-
          The walking time along streets and paths from the hex cell's centre
          to the nearest active dental practice in NHS England's Organisation
          Data Service, at 4.8 km/h, with each practice placed at the middle of
          its postcode (Code-Point Open). The register lists a practice whether
          it takes NHS patients or only private ones, and whether it is taking
          new patients: the NHS Business Services Authority records neither as
          open data. A practice nearby is therefore no promise of an
          appointment, which is why the evidence is indirect, and the measure
          shows where dentists are, not where a place is available.
        datasets: [nhs-ods, os-code-point-open, openstreetmap]
      - {id: health-care-quality, name: "Health-care quality and cost", default_weight: 3, scales: [across-cities]}

  - id: education
    name: Education
    description: Schools, nurseries and universities.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: schools
        name: Schools
        description: State schools nearby, by phase, and how their inspections went.
        default_weight: 3
        scales: [within-city]
        children:
          - id: primary-schools
            name: Primary schools
            description: Walking minutes to the nearest state primary school.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 6}
            curve_reason: &school-walk-reason >-
              1 within 6 minutes and 0 at 25 minutes: about 500 m and 2,000 m
              at 4.8 km/h, the desirable and the preferred maximum walking
              distances for school trips in Table 3.2 of the CIHT's Guidelines
              for Providing for Journeys on Foot (2000).
            evidence_type: direct
            comparable_across_regions: true
            method: &school-walk-method >-
              The walking time along streets and paths from the hex cell's
              centre to the nearest open state-funded school of this phase, from
              the DfE's register of schools, at 4.8 km/h. Admission follows each
              school's own criteria, often distance, so the nearest school is
              not always one a child can attend.
            datasets: [dfe-gias, openstreetmap]
          - id: secondary-schools
            name: Secondary schools
            description: Walking minutes to the nearest state secondary school.
            default_weight: 3
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 25, t1: 6}
            curve_reason: *school-walk-reason
            evidence_type: direct
            comparable_across_regions: true
            method: *school-walk-method
            datasets: [dfe-gias, openstreetmap]
          - id: school-inspections
            name: School inspection results
            description: The share of nearby state schools whose latest Ofsted inspection meets the standard.
            default_weight: 3
            status: built
            unit: "% of nearby schools"
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard says what share of schools should meet the standard,
              and nearly all of London's do (the median cell has 100%, and the
              5th percentile 80%), so a hex cell scores by its rank within the
              region, and the cells that have every nearby school meeting the
              standard tie. Ofsted says that the grades of its new report cards
              do not compare directly with earlier ones, so what meets the
              standard is a rule of this project (below), to be revisited once
              report cards cover most schools.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The share of the state-funded primary and secondary schools
              within a 25-minute walk (2,000 m at 4.8 km/h, along streets and
              paths) whose latest inspection meets the standard, from Ofsted's
              monthly record of each school's latest inspections (September
              2026), matched to the register of schools by URN. A school meets
              the standard if its latest inspection is a report card (since 10
              November 2025) with safeguarding standards met and no area graded
              needs attention or urgent improvement; or, before report cards,
              if its latest graded overall effectiveness is outstanding or good;
              or, with no grade, if a later inspection without grades says that
              it remains good or outstanding. A school with no such judgement,
              such as a new school, is left out, and a cell with fewer than 3
              judged schools within reach has no value (18% of London's cells:
              parks and the edge). The report card is the stricter test: 81% of
              London's schools with one meet the standard, against 98% of those
              judged before, so a cell whose schools were inspected lately
              scores lower for that reason. Ofsted inspects schools in England
              only, so the share does not compare across regions.
            datasets: [ofsted-school-inspections, dfe-gias]
      - id: nurseries
        name: Nurseries
        description: Walking minutes to the nearest nursery or pre-school.
        default_weight: 3
        scales: [within-city]
        status: built
        unit: minutes on foot
        preference_type: fixed
        curve: {shape: ramp, t0: 15, t1: 5}
        curve_reason: *walk-to-amenity-reason
        evidence_type: direct
        comparable_across_regions: false
        method: >-
          The walking time along streets and paths from the hex cell's centre to
          the nearest nursery or pre-school on Ofsted's register of childcare
          providers (full day care and sessional day care on non-domestic
          premises, as at 31 December 2025), at 4.8 km/h, placed at its postcode
          in Code-Point Open. Out-of-school clubs are left out. Ofsted hides the
          address of childminders and home childcarers, so they are not counted,
          and the walk is longer than a family with a childminder nearby has. The
          register says nothing about free places or fees, and inspection
          outcomes are not used.
        datasets: [ofsted-childcare, os-code-point-open]
      - {id: school-league-tables, name: "School league tables", default_weight: 3, scales: [within-city]}
      - {id: school-quality, name: "School quality", default_weight: 3, scales: [across-cities]}
      - {id: international-schools, name: "International schools", default_weight: 3, scales: [across-cities]}
      - {id: universities, name: "Universities", default_weight: 3, scales: [across-cities]}

  - id: community-and-people
    name: Community and people
    description: Who lives nearby, and the community life they share.
    default_weight: 3
    weight_reason: "Every factor starts equal, at the middle of the scale (the owner's choice, 2026-10-30). The evidence behind D14 is in the default-weights spec."
    scales: [within-city, across-cities]
    children:
      - id: community-composition
        name: Community composition
        description: Framed as the presence of a group the user picks, and as diversity (D08).
        default_weight: 3
        weight_reason: Starts equal like the other factors. It holds diversity, which counts, and the choice factor Your community, which stays at 0 until the user picks a group (D08, D18).
        children:
          - id: your-community
            name: Your community
            description: The presence of a group the user picks, by ethnic group, religion, country of birth or age.
            default_weight: 0
            weight_reason: "Choice factor: weight 0 until the user picks a group (D18)."
            scales: [within-city]
            status: built
            unit: "% of residents"
            preference_type: user-choice
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard sets how present a group should be, so a hex cell
              scores by its rank within the region by the share of residents in
              the chosen group. Only presence scores: the direction is fixed, so
              a group's absence never adds to a score (D08).
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              The share of residents in the chosen group, from Census 2021 by
              output area, combined over the output areas that overlap the hex
              cell, weighted by residents. The groups are the census's own
              categories, which differ between countries, so the share does not
              compare across regions. It offers the census's detailed ethnic groups
              (19), its religions (6, and no religion), the 10 places of birth
              that the census gives at the smallest areas and that are not too
              few to rank (the United Kingdom, the European Union in groups,
              other Europe and the continents) and six
              life stages made from its five-year age bands. Main language is not
              offered: the census gives the detailed languages only down to
              boroughs.
            datasets: &census-composition-datasets [ons-census-2021-topic-summaries, ons-output-area-boundaries]
          - id: diversity
            name: Diversity
            description: How mixed the area's residents are by ethnic group.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: diversity index, from 0 to 1
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard sets a level of diversity, so a hex cell scores by its
              rank within the region. The direction is fixed, because D08 frames
              composition as the presence of a chosen group and as diversity,
              never as fewer of any group.
            evidence_type: direct
            comparable_across_regions: false
            method: >-
              Simpson's diversity index over the census's 19 ethnic groups: the
              chance that two residents picked at random belong to different
              groups. It uses Census 2021 by output area, over the output areas
              that overlap the hex cell, weighted by residents. The groups are
              the census's own, so the index does not compare across regions.
            datasets: *census-composition-datasets
      - id: faith
        name: Faith
        description: Walking minutes to the nearest place of worship of the user's faith.
        default_weight: 0
        scales: [within-city]
        weight_reason: "Choice factor: weight 0 until the user picks a faith (D18)."
        status: built
        unit: minutes on foot
        preference_type: user-choice
        curve: {shape: ramp, t0: 15, t1: 5}
        curve_reason: *walk-to-amenity-reason
        evidence_type: direct
        comparable_across_regions: true
        method: >-
          The walking time along streets and paths from the hex cell's centre to
          the nearest place of worship of the chosen faith, at 4.8 km/h, from the
          religion that the place data records. Residents who share the faith
          count under Your community, by religion. Only OpenStreetMap records a
          place's religion (Overture does not). It is far from complete: London
          has 3,297 places of worship in OpenStreetMap, 98% with a religion,
          among them 2,752 Christian, 238 Muslim, 104 Jewish, 48 Hindu and 31
          Sikh, which is fewer than exist, so the walks to the smaller faiths'
          places are overstated. A religion with fewer than 10 places is not
          offered, and neither is "multifaith".
        datasets: [openstreetmap]
      - id: community-life
        name: Community life
        default_weight: 3
        scales: [within-city]
        children:
          - id: community-spaces
            name: Community spaces
            description: Walking minutes to the nearest community centre.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: minutes on foot
            preference_type: fixed
            curve: {shape: ramp, t0: 15, t1: 5}
            curve_reason: *walk-to-amenity-reason
            evidence_type: indirect
            comparable_across_regions: true
            method: >-
              The walking time along streets and paths from the hex cell's centre to
              the nearest community centre (Overture's category community center),
              at 4.8 km/h, from the category of Overture's places (leaving out those
              it marks permanently closed). The category holds community and village
              halls, centres run by councils and by faith groups, and some venues
              for hire. It does not say what goes on inside or who is welcome, so it
              shows where a place for neighbours to meet exists, not how much it is
              used.
            datasets: [overture-places]
          - id: lgbtq-friendly-venues
            name: LGBTQ+ venues
            description: The number of LGBTQ+ bars and LGBTQ+ organisations within a 30-minute walk.
            default_weight: 3
            scales: [within-city]
            status: built
            unit: venues
            preference_type: fixed
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard says how many are enough, so a hex cell scores by its rank
              within the region. These venues are few and cluster, so the walk is 30
              minutes (2.4 km at 4.8 km/h), the distance people go for a particular
              place, not the everyday one. Only presence scores, and the absence of
              a venue does not lower the score of any group (D08).
            evidence_type: indirect
            comparable_across_regions: true
            method: >-
              The number of places within a 30-minute walk along streets and paths
              whose Overture category is a gay bar or a gay and lesbian services
              organisation. This finds the venues that say they are LGBTQ+ and
              misses welcoming places that are not labelled so, so it is a lower
              bound and an indirect sign of how welcoming an area is. Legal rights
              and public acceptance belong to the across-cities scale.
            datasets: [overture-places]
          - {id: election-turnout, name: "Local election turnout", default_weight: 3}
          - id: residents-stay
            name: How long residents stay
            description: The share of residents who lived at the same address a year before the census.
            default_weight: 3
            status: built
            unit: "% of residents"
            preference_type: user-direction
            curve: {shape: percentile, better: higher}
            curve_reason: >-
              No standard sets how often people should move, and some users want
              a settled neighbourhood while others want one with newcomers, so a
              hex cell scores by its rank within the region and the user can flip
              the direction. It starts with more settled as better.
            evidence_type: indirect
            comparable_across_regions: false
            method: >-
              The share of usual residents in and around the hex cell who lived at
              the same address as at the 2021 census one year before (Census 2021,
              Migrant indicator, by output area, shared between hex cells by area
              as the residents are). It is a one-year snapshot, so it is an
              indirect sign of how long people stay. Census day was 21 March
              2021, in the pandemic, when fewer people moved than usual, so the
              shares are higher than in other years, and students who lived at a
              term-time address a year before are not counted as staying.
            datasets: [ons-census-2021-topic-summaries, ons-output-area-boundaries]
      - {id: english-proficiency, name: "English proficiency", default_weight: 3, scales: [across-cities]}
      - {id: expat-communities, name: "Expat communities", default_weight: 3, scales: [across-cities]}
      - {id: religious-freedom, name: "Religious freedom", default_weight: 3, scales: [across-cities]}
      - {id: gender-equality, name: "Gender equality", default_weight: 3, scales: [across-cities]}

  - id: culture-and-leisure
    name: Culture and leisure
