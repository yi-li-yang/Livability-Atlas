# Every dataset that the factor catalogue uses or plans to use. Measured
# indicators in factors.yaml name their datasets by id, best first. The field
# reference, and the rules the checks enforce, are in catalogue/README.md.
# Terms are defined in docs/glossary.md.
#
# Each licence is an SPDX id (https://spdx.org/licenses/), or unknown until it
# is confirmed at the source. A dataset goes into public builds only under a
# licence from D07's list, with the date it was checked (D07).
#
# After editing, refresh the factor explorer and run its tests:
#   node docs/factors/embed-catalogue.mjs
#   node --test "docs/factors/*.test.mjs"

datasets:
  - id: laei
    name: London Atmospheric Emissions Inventory (LAEI)
    publisher: Greater London Authority and Transport for London
    url: https://data.london.gov.uk/dataset/london-atmospheric-emissions-inventory--laei--2022
    tier: city
    area: Greater London
    resolution: 20 m grid
    date: 2022
    licence: unknown
    licence_checked: 2026-10-24
    public_build: false
    licence_note: >-
      The London Datastore gives the licence as "Not Specified", for the 2022
      and 2019 editions alike. Its terms let anyone use its data for any
      purpose, but name no licence. Ask the GLA Air Quality Team, the
      dataset's contact, to confirm an open licence before a public build.
    attribution: >-
      London Atmospheric Emissions Inventory 2022, Greater London Authority and
      Transport for London. The Greater London Authority cannot warrant the
      quality or accuracy of the data.
    tells:
      - Modelled annual mean concentrations of NO₂, NOx, PM10 and PM2.5 in 2022, on a 20 m grid
      - Emissions of air pollutants by source, such as road transport

  - id: defra-background-maps
    name: Background maps for local air quality management
    publisher: Defra and the devolved administrations
    url: https://uk-air.defra.gov.uk/data/laqm-background-home
    tier: country
    area: United Kingdom
    resolution: 1 km grid
    date: 2021 reference year, projected to 2040
    licence: unknown
    public_build: false
    licence_note: >-
      Not yet checked at the source: UK-AIR, which hosts the files, was offline
      for security updates on 2026-10-24. Defra's user guide for the maps
      (November 2024) is Crown copyright under the Open Government Licence
      v3.0. Nottingham City Council's copy of the maps credits them as Crown
      copyright under the Open Government Licence, but also calls them
      "specifically for LAQM purposes only". Check UK-AIR's terms before a
      public build.
    attribution: © Crown copyright, Defra, via uk-air.defra.gov.uk.
    tells:
      - Modelled annual mean background concentrations of NOx, NO₂, PM10 and PM2.5, for each year from 2021 to 2040
      - An estimated split of those concentrations by source sector

  - id: tfl-unified-api
    name: TfL Unified API
    publisher: Transport for London
    url: https://api-portal.tfl.gov.uk/
    tier: city
    area: Greater London, and TfL services beyond it
    resolution: points, for stations and stops
    date: live, updated continually
    licence: LicenseRef-TfL-Open-Data
    licence_checked: 2026-10-24
    public_build: true
    licence_note: >-
      TfL's licence is version 2.0 of the Open Government Licence with TfL's
      amendments. It allows commercial use and redistribution with attribution,
      but needs registration for the live feeds and limits requests to 500 a
      minute per feed, and TfL may revise it without notice. Check it again
      before each public build.
    attribution: >-
      Powered by TfL Open Data. Contains OS data © Crown copyright and database
      rights 2016 and Geomni UK Map data © and database rights [2019].
    tells:
      - The location of every station and stop, and the lines that serve it
      - The fare zone of each station
      - Journey plans by public transport between any two places

  - id: tfl-ptal
    name: Public Transport Accessibility Levels (PTAL)
    publisher: Transport for London, on the London Datastore
    url: https://data.london.gov.uk/dataset/public-transport-accessibility-levels
    tier: city
    area: Greater London
    resolution: 100 m grid
    date: 2015
    licence: OGL-UK-2.0
    licence_checked: 2026-10-24
    public_build: true
    attribution: >-
      Public Transport Accessibility Levels, Transport for London. Contains
      public sector information licensed under the Open Government Licence
      v2.0. The Greater London Authority cannot warrant the quality or accuracy
      of the data.
    tells:
      - The PTAL band of each 100 m grid square in 2015, from 0 (worst) to 6b (best)
      - The average access index of census areas, wards and boroughs

  - id: naptan
    name: National Public Transport Access Nodes (NaPTAN)
    publisher: Department for Transport
    url: https://beta-naptan.dft.gov.uk/
    tier: country
    area: Great Britain
    resolution: points, for every stop and station
    date: updated daily
    licence: OGL-UK-3.0
    licence_checked: 2026-10-24
    public_build: true
    attribution: Contains public sector information licensed under the Open Government Licence v3.0.
    tells:
      - The location and type of every public transport stop and station, for bus, coach, rail, metro, Underground, tram, ferry and air

  - id: openstreetmap
    name: OpenStreetMap
    publisher: OpenStreetMap contributors
    url: https://www.openstreetmap.org/
    tier: global
    area: World
    resolution: points, lines and areas, mapped by volunteers
    date: updated continually
    licence: ODbL-1.0
    licence_checked: 2026-10-24
    public_build: true
    licence_note: >-
      The ODbL is share-alike: a database built from OpenStreetMap must be
      published under the ODbL too, as D12 expects for data bundles.
    attribution: © OpenStreetMap contributors, available under the Open Database License.
    tells:
      - Streets and paths, for walking routes and times
      - Stations, stops, and the routes of rail, Tube, tram and bus lines

  - id: defra-road-noise
    name: Strategic noise maps of roads, England (Round 4)
    publisher: Department for Environment, Food and Rural Affairs (Defra)
    url: https://environment.data.gov.uk/explore/562c9d56-7c2d-4d42-83bb-578d6e97a517
    tier: country
    area: England
    resolution: 10 m grid, at 4 m above ground
    date: 2022
    licence: OGL-UK-3.0
    licence_checked: 2026-10-25
    public_build: true
    licence_note: >-
      The record names the Open Government Licence without a version, and sets
      no access constraints. The version in force is 3.0.
    attribution: >-
      Strategic noise mapping, Round 4, Defra. Contains public sector
      information licensed under the Open Government Licence v3.0.
    tells:
      - Modelled road traffic noise in 2022, as Lden, LAeq,16h, Lday, Levening and Lnight, down to 40 dB (35 dB at night)

  - id: defra-rail-noise
